# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/himorime/main/schema/himorime.schema.json
#
# block measured end to end with himorime (https://github.com/nao1215/himorime):
# the process a user or CI starts, from its first instruction to its exit.
#
#   make bench          measure the working tree
#   make bench-compare  compare main with the working tree
#
# On a pull request, .github/workflows/bench.yml runs `himorime ci bench`:
# the base of the pull request and its head are built and measured in
# interleaved rounds on the same runner. See bench/README.md.
#
# Inputs are generated by gen.sh before measuring. Both revisions run the
# working tree's gen.sh (${head_root}) and the working tree's fake GitHub
# (e2e/fakegh), so they lock the same releases and install the same bytes.
# Nothing is measured against the network: block lock and downloads are not
# measured (see bench/README.md).
version: "1"

suite:
  name: block
  description: Start-up, installing a locked tool from the download cache, a sync with nothing to do, running a tool through block exec, and a missing block.lock.

build:
  command: [go, build, -trimpath, -o, "${artifact}", .]
  cwd: ..

defaults:
  warmup: 2
  runs: 20
  # The store, HOME and the XDG directories live in the benchmark's own
  # directory. The GitHub API is a closed loopback port and no token is set,
  # so a command that tried to reach the network would fail instead of
  # measuring it.
  env:
    HOME: "${workdir}"
    XDG_CONFIG_HOME: "${workdir}/.config"
    XDG_DATA_HOME: "${workdir}/.local/share"
    BLOCK_HOME: "${workdir}/project/home"
    BLOCK_GITHUB_API_URL: "http://127.0.0.1:1"
    GITHUB_TOKEN: ""
    GH_TOKEN: ""
  metrics:
    cpu: true
    memory: true
  regression:
    confidence: 0.95
    latency:
      max_percent: 10
      min_difference: 1ms
    cpu:
      max_percent: 15
      min_difference: 2ms
    memory:
      max_percent: 15
      min_difference: 2MiB

benchmarks:
  # block tells itself from the shims it writes by the name it was started
  # as, and ${artifact} is a file named "artifact". Every benchmark runs it
  # through a link named block in its own directory.
  - name: version
    description: Starting block and printing its version and the registry snapshot it carries.
    tags: [smoke]
    setup:
      - &link
        command: [sh, -c, 'mkdir -p "$1/bin" && ln -s "$2" "$1/bin/block"', sh, "${workdir}", "${artifact}"]
    commands:
      block:
        command: ["${workdir}/bin/block", version]

  - name: sync 1
    description: >-
      Installing the one tool block.lock pins from the download cache: checking
      the archive's sha256, extracting it into the store and writing the shims.
      The install is removed before every run.
    tags: [smoke]
    setup: &store
      - *link
      - command: [go, build, -o, "${workdir}/fakegh", ../e2e/fakegh]
        cwd: "${head_root}"
      - command: [sh, "${head_root}/gen.sh", store, "${workdir}/project", "${workdir}/bin/block", "${workdir}/fakegh"]
    prepare_each:
      - &uninstall
        command: [rm, -rf, "${workdir}/project/home/tools", "${workdir}/project/home/shims"]
    commands:
      block:
        command: ["${workdir}/bin/block", sync]
        cwd: "${workdir}/project"

  - name: sync 1 installed
    description: A sync whose tool is already in the store, as in CI after the store is restored from a cache.
    tags: [smoke]
    setup: *store
    commands:
      block:
        command: ["${workdir}/bin/block", sync]
        cwd: "${workdir}/project"

  - name: sync 32MiB
    description: >-
      Installing one tool whose archive holds an executable of 32 MiB from the
      download cache: hashing the archive, decompressing and writing it. The
      install is removed before every run.
    tags: [large]
    setup:
      - *link
      - command: [go, build, -o, "${workdir}/fakegh", ../e2e/fakegh]
        cwd: "${head_root}"
      - command: [sh, "${head_root}/gen.sh", store, "${workdir}/project", "${workdir}/bin/block", "${workdir}/fakegh"]
      - command: [sh, "${head_root}/gen.sh", payload, "32", "${workdir}/project"]
    prepare_each:
      - *uninstall
    metrics:
      throughput:
        work: {file_size: "${workdir}/project/payload.tar.gz", unit: bytes}
    commands:
      block:
        command: ["${workdir}/bin/block", sync]
        cwd: "${workdir}/project"

  # block exec reads block.toml, block.lock and the store and then runs the
  # tool; nothing in it grows with an input, so it has no large benchmark.
  - name: exec 1
    description: Running the installed tool through block exec, which finds it from block.lock and the store.
    tags: [smoke]
    setup: *store
    commands:
      block:
        command: ["${workdir}/bin/block", exec, foo, --version]
        cwd: "${workdir}/project"

  - name: sync error
    description: A sync in a project that has block.toml but no block.lock, which fails with BLK1003 and exit 1.
    tags: [smoke]
    setup:
      - *link
      - command: [sh, -c, 'mkdir -p "$1" && printf "[tools]\nfoundry = \"1.7\"\n" > "$1/block.toml"', sh, "${workdir}/project"]
    exit_codes: [1]
    commands:
      block:
        command: ["${workdir}/bin/block", sync]
        cwd: "${workdir}/project"
