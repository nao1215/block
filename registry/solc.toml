# solc: the Solidity compiler.
# https://github.com/argotorg/solidity (moved from ethereum/solidity)
#
# Releases ship single static executables rather than archives: one for
# Linux x86_64, one universal macOS binary, and one Windows build whose name
# carries the .exe the others do not.
name = "solc"
ecosystems = ["ethereum"]
description = "The Solidity smart-contract compiler"

[source]
type = "github_release"
repo = "argotorg/solidity"
asset = "solc-{os}"
platforms = ["linux/amd64", "darwin/amd64", "darwin/arm64", "windows/amd64"]
bin = ["solc"]

[source.os]
linux = "static-linux"
darwin = "macos"
windows = "windows.exe"
