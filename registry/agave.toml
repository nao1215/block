# Agave: the Solana validator client and CLI suite by Anza.
# https://github.com/anza-xyz/agave
#
# The release asset carries no version in its name (the release does), is
# bzip2-compressed, and wraps its tools in solana-release/bin/.
#
# Windows is not claimed. Anza stopped shipping the Windows prebuilt
# (anza-xyz/agave#15471, backported to the 4.4 line as #16469): v4.3.2 is the
# last release with solana-release-x86_64-pc-windows-msvc.tar.bz2, and from
# v4.4.0 on a Windows user would be sent to an asset that does not exist.
name = "agave"
ecosystems = ["solana"]
description = "Solana validator client and CLI suite, including a local test validator"

[source]
type = "github_release"
repo = "anza-xyz/agave"
asset = "solana-release-{arch}-{os}.tar.bz2"
strip_components = 1
platforms = ["linux/amd64", "darwin/amd64", "darwin/arm64"]
bin = ["bin/solana", "bin/solana-keygen", "bin/solana-test-validator", "bin/agave-ledger-tool"]

[source.os]
linux = "unknown-linux-gnu"
darwin = "apple-darwin"

[source.arch]
amd64 = "x86_64"
arm64 = "aarch64"
