# anvil-zksync: in-memory ZKsync node for local development.
# https://github.com/matter-labs/anvil-zksync
name = "anvil-zksync"
ecosystems = ["ethereum", "zksync"]
description = "In-memory ZKsync node for local development and testing"

[source]
type = "github_release"
repo = "matter-labs/anvil-zksync"
asset = "anvil-zksync-v{version}-{arch}-{os}.tar.gz"
platforms = ["linux/amd64", "linux/arm64", "darwin/amd64", "darwin/arm64"]
bin = ["anvil-zksync"]

[source.os]
linux = "unknown-linux-gnu"
darwin = "apple-darwin"

[source.arch]
amd64 = "x86_64"
arm64 = "aarch64"
