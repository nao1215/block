# The Stellar CLI: build, test and deploy Soroban smart contracts.
# https://github.com/stellar/stellar-cli
name = "stellar"
ecosystems = ["stellar"]
description = "Stellar CLI for building, testing and deploying Soroban contracts"

[source]
type = "github_release"
repo = "stellar/stellar-cli"
asset = "stellar-cli-{version}-{arch}-{os}.tar.gz"
platforms = ["linux/amd64", "linux/arm64", "darwin/amd64", "darwin/arm64", "windows/amd64"]
bin = ["stellar"]

[source.os]
linux = "unknown-linux-gnu"
darwin = "apple-darwin"
windows = "pc-windows-msvc"

[source.arch]
amd64 = "x86_64"
arm64 = "aarch64"
