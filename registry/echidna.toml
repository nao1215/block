# Echidna: property-based fuzzer for Ethereum smart contracts.
# https://github.com/crytic/echidna
name = "echidna"
ecosystems = ["ethereum"]
description = "Property-based fuzzer for EVM smart contracts"

[source]
type = "github_release"
repo = "crytic/echidna"
asset = "echidna-{version}-{arch}-{os}.tar.gz"
platforms = ["linux/amd64", "linux/arm64", "darwin/amd64", "darwin/arm64"]
bin = ["echidna"]

[source.os]
darwin = "macos"

[source.arch]
amd64 = "x86_64"
arm64 = "aarch64"
