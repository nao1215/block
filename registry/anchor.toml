# Anchor: the Solana smart-contract framework CLI.
# https://github.com/coral-xyz/anchor
#
# Releases ship one raw executable per platform, not archives. The Windows
# build is the only one whose name carries an extension.
name = "anchor"
ecosystems = ["solana"]
description = "Framework and CLI for writing, testing and deploying Solana programs"

[source]
type = "github_release"
repo = "coral-xyz/anchor"
asset = "anchor-{version}-{arch}-{os}"
platforms = ["linux/amd64", "darwin/amd64", "darwin/arm64", "windows/amd64"]
bin = ["anchor"]

[source.os]
linux = "unknown-linux-gnu"
darwin = "apple-darwin"
windows = "pc-windows-msvc.exe"

[source.arch]
amd64 = "x86_64"
arm64 = "aarch64"
