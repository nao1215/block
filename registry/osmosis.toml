# Osmosis: the osmosisd node of the Osmosis chain.
# https://github.com/osmosis-labs/osmosis
name = "osmosis"
ecosystems = ["cosmos"]
description = "Osmosis appchain node (osmosisd), the Cosmos AMM"

[source]
type = "github_release"
repo = "osmosis-labs/osmosis"
asset = "osmosisd-{version}-{os}-{arch}.tar.gz"
platforms = ["linux/amd64", "linux/arm64", "darwin/amd64", "darwin/arm64"]
bin = ["osmosisd"]
