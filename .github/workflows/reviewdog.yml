name: reviewdog
on: [pull_request]

permissions:
  contents: read

jobs:
  misspell:
    name: misspell
    runs-on: ubuntu-latest
    # github-pr-review posts review comments on the pull request.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No locale. block's prose is British English throughout — behaviour,
      # catalogue, cancelled — and with the locale set to US every one of
      # those was reported as a misspelling, which buried the real ones. UK
      # is not the answer either: it wants "artefact", and an artifact is
      # what a release publishes and what block.lock calls it. Without a
      # locale, misspell reports typos and leaves the dialect alone.
      - name: misspell
        uses: reviewdog/action-misspell@3467363dab5b42db2b1372c5fd2b1771fea2ea48 # v1.30.3
        with:
          reporter: github-pr-review
          level: warning

  actionlint:
    runs-on: ubuntu-latest
    # github-pr-review posts review comments on the pull request.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@cfa6a621f27735ccc88d35af9d0608692fd9b9f7 # v1.80.8
        with:
          reporter: github-pr-review
          level: warning

  shellcheck:
    runs-on: ubuntu-latest
    # github-pr-review posts review comments on the pull request.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The shell scripts are the e2e bootstrap and the release/registry
      # helpers: errors there hide behind "the suite passed" or "the sync
      # ran", so they get the same review the Go does.
      - uses: reviewdog/action-shellcheck@d0b8d5fd7fad6afdb6e1b6ce1778892be4d1f427 # v1.34.1
        with:
          reporter: github-pr-review
          level: error
          fail_level: error
          pattern: "*.sh"
