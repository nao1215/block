name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Build
        run: go build ./...

      # The live upstream checks are behind a build tag, so `go build ./...`
      # and `go test ./...` never compile them: they went stale once already,
      # unnoticed, because the only thing that builds them runs weekly. This
      # step is seconds long and touches no network.
      - name: Type-check the build-tagged live checks
        run: go vet -tags=live ./...
