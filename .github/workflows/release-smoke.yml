name: Release Smoke

# Build the GoReleaser artifacts in snapshot mode (no publishing) and smoke-test
# them on every PR and push to main, so packaging regressions are caught before
# a release is ever tagged.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: GoReleaser artifact smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: false

      - name: Install go-licenses
        run: go install github.com/google/go-licenses/v2@v2.0.1
      - name: Build release artifacts (snapshot, no publish)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: release --snapshot --clean --skip=publish,sign,sbom

      - name: Smoke-test artifacts
        run: ./scripts/smoke_artifacts.sh dist
