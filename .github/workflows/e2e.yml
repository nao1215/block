name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: Offline E2E (atago, ${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    # Git Bash on the Windows runner: the harness is one POSIX script, and the
    # scenarios are YAML atago interprets itself, so the suite needs a shell
    # rather than a rewrite. What is genuinely different on Windows — a .zip
    # artifact, the .exe suffix, shims placed as hard links or copies, PATH
    # matched without regard to case — is covered by the scenarios in
    # e2e/atago/windows.atago.yaml, which are gated to run only there.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Install atago
        uses: nao1215/setup-atago@e4b6719aea547a68e6c15252222babab7f492a88 # v0.1.1
        with:
          version: v0.21.0

      - name: Run offline end-to-end tests
        run: make e2e
