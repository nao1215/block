name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run for the push before it; runs on
# main and scheduled runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Offline E2E (atago, ${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    # Git Bash on the Windows runner: the harness is one POSIX script, and the
    # scenarios are YAML atago interprets itself, so the suite needs a shell
    # rather than a rewrite. What is genuinely different on Windows — a .zip
    # artifact, the .exe suffix, shims placed as hard links or copies, PATH
    # matched without regard to case — is covered by the scenarios in
    # e2e/atago/windows.atago.yaml, which are gated to run only there.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Install atago
        uses: nao1215/setup-atago@5dca90fe652651408ccd1c2aee030767484482a9 # v0.1.5
        with:
          version: v0.26.3

      - name: Run offline end-to-end tests
        run: make e2e
