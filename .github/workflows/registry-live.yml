name: Registry (live)

# Checks every recipe against the real upstreams: newest stable version,
# artifact for each declared platform, checksum, unpack, and a probe of the
# executables the recipe promises. This is what keeps recipes current without
# a human watching releases — routine upstream versions need no change here,
# and a failure means a recipe stopped matching reality.
#
# It runs on one runner per platform block supports, because "the artifact
# exists" is not the same claim as "the artifact unpacks and the binary in it
# runs here". Each leg downloads, verifies, extracts and executes the tools for
# its own platform, and checks that the artifacts for the others resolve; taken
# together the matrix covers every platform in the registry with a real run
# rather than a HEAD request.
#
# It downloads real artifacts and calls the GitHub API, so it is scheduled
# rather than run on every push, and never mixed into the unit or E2E suites.

on:
  workflow_dispatch:
    inputs:
      tools:
        description: "Recipe names to check (a Go test regexp, e.g. foundry|geth). Empty means all."
        required: false
        default: ""
  schedule:
    # Mondays, 03:17 UTC.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  # The example manifests pin real version lines, so they age the same way a
  # recipe does. One runner is enough: resolution is platform-independent, and
  # nothing is downloaded.
  examples:
    name: Example manifests still resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Check that the example manifests still resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make examples-live

  live:
    name: Recipes on ${{ matrix.platform }}
    strategy:
      # Every platform is checked even when one of them is broken: a recipe
      # that dropped macOS is a different finding from one that dropped Linux,
      # and a maintainer wants both in the same run.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
          - os: macos-latest
            platform: darwin/arm64
          - os: macos-15-intel
            platform: darwin/amd64
          - os: windows-latest
            platform: windows/amd64
          - os: windows-11-arm
            platform: windows/arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      # One recipe — besu — installs a Java application: what upstream ships
      # is a JAR with launcher scripts, and the launcher refuses to start
      # without a recent JVM. block installs the client, not the runtime, so
      # the runtime is the runner's job for the probe to mean anything.
      #
      # Best effort, because a JDK is not available for every runner in this
      # matrix (Temurin publishes no Windows arm64 build of 25), and the legs
      # where it is missing are the legs where no recipe needing it ships
      # anything — besu is Linux and macOS only. If that ever stops being
      # true, the probe fails with the launcher's own "Java version must be at
      # least ..." rather than silently passing.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        continue-on-error: true
        with:
          distribution: temurin
          java-version: "25"

      # A recipe is only checked on the platform it claims to ship for, so the
      # runner has to be the platform the leg says it is. A silently wrong
      # image would turn the whole leg into skips that read as passes.
      - name: Confirm the runner is ${{ matrix.platform }}
        env:
          WANT: ${{ matrix.platform }}
        run: |
          got="$(go env GOOS)/$(go env GOARCH)"
          if [ "$got" != "$WANT" ]; then
            echo "this runner is $got, but the matrix leg claims $WANT" >&2
            exit 1
          fi

      - name: Validate the registry against upstream
        env:
          # Raises the API rate limit; the recipes themselves are public.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOOLS: ${{ inputs.tools }}
        run: |
          if [ -n "$TOOLS" ]; then
            make registry-live RECIPE="$TOOLS"
          else
            make registry-live
          fi
