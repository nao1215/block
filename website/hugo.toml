# Configuration for the hosted documentation website (GitHub Pages).
# Content comes from the repository itself: doc/cookbook.md is mounted
# read-only and turned into a page by content/_content.gotmpl, so the committed
# file stays the single source of truth.
baseURL = "https://nao1215.github.io/block/"
locale = "en"
title = "block"
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true
timeZone = "UTC"

[params]
tagline = "a reproducible toolchain manager for blockchain development"
description = "block pins the blockchain CLI tools a project depends on — Foundry, geth, reth, Lighthouse, Agave, Hermes and 45 more — verifies every download against a lockfile, and reproduces the same toolchain locally and in CI."

[markup.highlight]
noClasses = false

[markup.tableOfContents]
startLevel = 2
endLevel = 3

[[menus.main]]
name = "Install"
pageRef = "/install"
weight = 10

[[menus.main]]
name = "Getting started"
pageRef = "/getting-started"
weight = 20

[[menus.main]]
name = "Cookbook"
