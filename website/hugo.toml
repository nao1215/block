weight = 30

[[menus.main]]
name = "Commands"
pageRef = "/commands"
weight = 40

[[menus.main]]
name = "Reference"
pageRef = "/reference"
weight = 44

[[menus.main]]
name = "Tools"
pageRef = "/tools"
weight = 46

[[menus.main]]
