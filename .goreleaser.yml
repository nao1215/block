version: 2
project_name: block
env:
  - GO111MODULE=on
before:
  hooks:
    - go mod tidy
builds:
  - main: .
    ldflags:
      - -s -w -X github.com/nao1215/block/internal/cmdinfo.Version=v{{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
nfpms:
  - maintainer: Naohiro CHIKAMATSU <n.chika156@gmail.com>
    description: "Lock your blockchain toolchain: pin Foundry, Hermes and friends per project and reproduce them in CI"
    homepage: https://github.com/nao1215/block
    license: MIT License
    formats:
      - deb
      - rpm
      - apk

checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"
release:
  header: |
    ## block {{ .Tag }}

    Lock your blockchain toolchain: declare tools in `block.toml`, pin them in
    `block.lock`, and reproduce the same toolchain locally and in CI.

    Every artifact below — archives and .deb/.rpm/.apk packages alike — is
    listed in `checksums.txt`, ships with an SPDX SBOM, and carries build
    provenance. `checksums.txt` is the file cosign signs; verifying that one
    signature and checking a download against the line naming it is what
    covers the rest. See
    [Verify what you downloaded](https://nao1215.github.io/block/install/#verify-what-you-downloaded).
  footer: |
    **Full changelog**: https://github.com/nao1215/block/compare/{{ .PreviousTag }}...{{ .Tag }}
changelog:
  sort: asc
  use: github
  groups:
    - title: "Breaking changes"
      regexp: '^.*?[a-zA-Z]+(\(.+\))??!:.+$'
      order: 0
    - title: "Features"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 1
    - title: "Bug fixes"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 2
    - title: "Registry"
      regexp: '^.*?registry(\(.+\))??!?:.+$'
      order: 3
    - title: "Documentation"
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 4
    - title: "Others"
      order: 999
  filters:
    exclude:
      - "^tests?(\\(.+\\))?!?:"
      - "^chore(\\(.+\\))?!?:"
      - "^style(\\(.+\\))?!?:"
      - "^ci(\\(.+\\))?!?:"
      - "Merge pull request"
      - "Merge branch"
# An SBOM per distributable artifact, not only per archive: a .deb is what a
# Debian user actually installs, and "ships with an SBOM" has to be true of it
# too. Two entries because GoReleaser scopes each one to a single artifact
# class.
sboms:
  - id: archives
    artifacts: archive
  - id: packages
    artifacts: package
# Keyless artifact signing with cosign. checksums.txt lists every distributable
# artifact — archives and .deb/.rpm/.apk packages alike — so one signature over
# it covers all of them: verify the signature, then verify a download against
# the line that names it. That is an indirection, and the README says so rather
# than implying each file carries its own signature.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true
homebrew_casks:
  - name: block
    repository:
      owner: nao1215
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/nao1215/block"
    description: "Lock your blockchain toolchain: pin Foundry, Hermes and friends per project and reproduce them in CI"
    # The binary is not signed/notarized, so strip the quarantine attribute on
    # install — otherwise Gatekeeper blocks the cask-installed binary with
    # "cannot verify the developer" (the pattern GoReleaser documents for
    # unsigned Go binaries).
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/block"]
          end

