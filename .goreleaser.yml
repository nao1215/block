version: 2
project_name: block
env:
  - GO111MODULE=on
before:
  hooks:
    - go mod tidy
builds:
  - main: .
    ldflags:
      - -s -w -X github.com/nao1215/block/internal/cmdinfo.Version=v{{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
nfpms:
  - maintainer: Naohiro CHIKAMATSU <n.chika156@gmail.com>
    description: "Lock your blockchain toolchain: pin Foundry, Hermes and friends per project and reproduce them in CI"
    homepage: https://github.com/nao1215/block
    license: MIT License
    formats:
      - deb
      - rpm
      - apk

checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"
release:
  header: |
    ## block {{ .Tag }}

    Lock your blockchain toolchain: declare tools in `block.toml`, pin them in
    `block.lock`, and reproduce the same toolchain locally and in CI.

    Every artifact is signed and ships with an SBOM and build provenance — see
    [Verifying release integrity](https://github.com/nao1215/block#verifying-release-integrity).
  footer: |
    **Full changelog**: https://github.com/nao1215/block/compare/{{ .PreviousTag }}...{{ .Tag }}
changelog:
  sort: asc
  use: github
  groups:
    - title: "Breaking changes"
      regexp: '^.*?[a-zA-Z]+(\(.+\))??!:.+$'
      order: 0
    - title: "Features"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 1
    - title: "Bug fixes"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 2
    - title: "Registry"
      regexp: '^.*?registry(\(.+\))??!?:.+$'
      order: 3
    - title: "Documentation"
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 4
    - title: "Others"
      order: 999
  filters:
    exclude:
      - "^tests?(\\(.+\\))?!?:"
      - "^chore(\\(.+\\))?!?:"
      - "^style(\\(.+\\))?!?:"
      - "^ci(\\(.+\\))?!?:"
      - "Merge pull request"
      - "Merge branch"
sboms:
  - artifacts: archive
# Keyless artifact signing with cosign. Signing the checksums file transitively
# covers every published artifact.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true
homebrew_casks:
  - name: block
    repository:
      owner: nao1215
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/nao1215/block"
    description: "Lock your blockchain toolchain: pin Foundry, Hermes and friends per project and reproduce them in CI"
    # The binary is not signed/notarized, so strip the quarantine attribute on
    # install — otherwise Gatekeeper blocks the cask-installed binary with
    # "cannot verify the developer" (the pattern GoReleaser documents for
    # unsigned Go binaries).
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/block"]
          end

# Scoop distribution for Windows, the one platform CI tests on every push but no
# package manager could reach. The bucket lives in this repository under
# `bucket/`, which Scoop accepts the same as a dedicated bucket repository:
#
#   scoop bucket add nao1215 https://github.com/nao1215/block
#   scoop install nao1215/block
#
# Keeping it here means GoReleaser publishes the manifest with the workflow's
# built-in GITHUB_TOKEN — there is no cross-repository token to provision, and
# no second repository whose only content is one generated JSON file. Skipped by
# `--skip=publish` (release-smoke), so snapshot builds stay hermetic.
scoops:
  - name: block
    repository:
      owner: nao1215
      name: block
      branch: main
    directory: bucket
    homepage: "https://github.com/nao1215/block"
    description: "Lock your blockchain toolchain: pin Foundry, Hermes and friends per project and reproduce them in CI"
    license: MIT
    commit_msg_template: "chore(scoop): update the bucket manifest for {{ .Tag }}"
