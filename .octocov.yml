coverage:
  paths:
    - cover.out
  acceptable: 90%
  # The atago-driven E2E suite drives the real CLI, so main.go and the cobra
  # wiring are measured. What is excluded is what block never runs: the
  # offline test infrastructure and the maintenance commands.
  exclude:
    - "github.com/nao1215/block/e2e/fakegh/main.go"
    - "github.com/nao1215/block/internal/fakegh/fakegh.go"
    # The compiled stand-in the fake GitHub serves as every tool. Like the
    # server itself, it is E2E infrastructure: block never runs this code,
    # and the suite exercises it end to end on every push.
    - "github.com/nao1215/block/e2e/faketool/main.go"
    # Maintenance commands. Neither is part of block — `go install` does not
    # build them — and both are run by make targets and by CI, which is what
    # says they work.
    - "github.com/nao1215/block/scripts/gen-docs/main.go"
    - "github.com/nao1215/block/scripts/registry-snapshot/main.go"
  badge:
    path: doc/coverage.svg
# When this repository goes public, add "artifact://nao1215/block" to the
# central list in nao1215/octocovs-central-repo and point the README badge at
# the badge it generates. It cannot be added while block is private: that
# workflow reads the artifacts with its own GITHUB_TOKEN, which has no access
# here, and adding the entry would fail the central run rather than produce a
# badge. Until then doc/coverage.svg, committed by the Coverage job, is the
# badge the README shows.
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
comment:
  if: is_pull_request
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}
codeToTestRatio:
  code:
    - "**/*.go"
    - "!**/*_test.go"
    - "!internal/fakegh/**"
    - "!e2e/**"
  test:
    - "**/*_test.go"
    - "e2e/atago/**"
    - "examples/*.toml"
  badge:
    path: doc/ratio.svg
