# Artifact handling: archive formats, nested executables, and the archives
# block must refuse (path traversal, links, missing executables) plus hosts
# that ship nothing for this platform. Run with: make e2e
version: "1"

suite:
  name: block artifacts

scenarios:
  - name: zip archives are extracted like tarballs
    env: &t1
      BLOCK_HOME: "${workdir}/home"
      BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}/t1"
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.zipper]
            version = "3"
            [tools.zipper.source]
            type = "github_release"
            repo = "example/zipper"
            asset = "zipper_{version}_{os}_{arch}.zip"
            bin = ["zipper"]
      - run:
          shell: true
          command: block lock && block sync
      - assert:
          exit_code: 0
          stdout:
            contains: "zipper  3.0.0  installed"
      - run:
          command: block exec zipper
      - assert:
          exit_code: 0
          stdout:
            contains: "zipper 3.0.0 (fake)"

  - name: executables in a subdirectory of the archive are found
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.nested]
            version = "1"
            [tools.nested.source]
            type = "github_release"
            repo = "example/nested"
            asset = "nested_{version}_{os}_{arch}.tar.gz"
            bin = ["bin/nested"]
      - run:
          shell: true
          command: block lock && block sync
      - run:
          command: block exec nested
      - assert:
          exit_code: 0
          stdout:
            contains: "nested 1.0.0 (fake)"

  - name: a recipe that does not ship this platform is rejected at lock time
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.maconly]
            version = "0.1"
            [tools.maconly.source]
            type = "github_release"
            repo = "example/maconly"
            asset = "maconly_{version}_{os}_{arch}.tar.gz"
            platforms = ["${env:BLOCK_OTHER_PLATFORM}"]
            bin = ["maconly"]
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            equals: "block: maconly: unsupported platform ${env:BLOCK_PLATFORM} (available: ${env:BLOCK_OTHER_PLATFORM})\n"
          changes:
            created: []

  - name: a release missing the expected asset names what it does have
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.foo]
            version = "1.2"
            [tools.foo.source]
            type = "github_release"
            repo = "example/foo"
            asset = "foo-{version}-{os}-{arch}.tar.gz"
            bin = ["foo"]
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            contains:
              - 'block: foo: release v1.2.0 of example/foo has no asset "foo-1.2.0-'
              - "foo_1.2.0_${env:BLOCK_ASSET_PLATFORM}.tar.gz"

  - name: an archive that escapes its directory is refused
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.evil]
            version = "1"
            [tools.evil.source]
            type = "github_release"
            repo = "example/evil"
            asset = "evil_{version}_{os}_{arch}.tar.gz"
            bin = ["evil"]
      - run:
          shell: true
          command: block lock && block sync
      - assert:
          exit_code: 1
          stderr:
            contains: 'block: evil: extract evil_1.0.0_${env:BLOCK_ASSET_PLATFORM}.tar.gz: refusing to extract "../escape": path escapes the destination'
      - assert:
          file:
            path: home/tools/escape
            exists: false
      - assert:
          file:
            path: home/escape
            exists: false
      - assert:
          dir:
            path: home/tools/evil
            exists: true
            count: 0

  - name: an archive containing a symlink is refused
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.linky]
            version = "1"
            [tools.linky.source]
            type = "github_release"
            repo = "example/linky"
            asset = "linky_{version}_{os}_{arch}.tar.gz"
            bin = ["linky"]
      - run:
          shell: true
          command: block lock && block sync
      - assert:
          exit_code: 1
          stderr:
            contains: 'refusing to extract link "etc-passwd": links are not supported'

  - name: an archive without the declared executable is not installed
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.nobin]
            version = "1"
            [tools.nobin.source]
            type = "github_release"
            repo = "example/nobin"
            asset = "nobin_{version}_{os}_{arch}.tar.gz"
            bin = ["nobin"]
      - run:
          shell: true
          command: block lock && block sync
      - assert:
          exit_code: 1
          stderr:
            contains: 'block: nobin: archive nobin_1.0.0_${env:BLOCK_ASSET_PLATFORM}.tar.gz: executable "nobin" is missing'
      - assert:
          dir:
            path: home/tools/nobin
            count: 0

  - name: an archive that wraps its tools in a versioned directory is unwrapped
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.bundle]
            version = "2"
            [tools.bundle.source]
            type = "github_release"
            repo = "example/bundle"
            asset = "bundle-release-{os}-{arch}.tar.gz"
            strip_components = 1
            bin = ["bin/bundle-cli", "bin/bundle-node"]
      - run:
          shell: true
          command: block lock && block sync
      - assert:
          exit_code: 0
          stdout:
            contains: "bundle  2.0.0  installed"
      # strip_components dropped the wrapping directory: the tools sit under
      # bin/, not bundle-release/bin/.
      - assert:
          dir:
            path: home/tools/bundle
            recursive: true
            glob: "bundle-cli"
      - assert:
          dir:
            path: home/tools/bundle
            recursive: true
            not_contains: ["bundle-release"]
      - run:
          command: block exec bundle-cli run
      - assert:
          exit_code: 0
          stdout:
            contains: "bundle-cli 2.0.0 (fake)"
      - run:
          command: block exec bundle-node
      - assert:
          exit_code: 0
          stdout:
            contains: "bundle-node 2.0.0 (fake)"

  - name: an upstream whose platform strings are not os and arch uses a target map
    env: *t1
    steps:
      # Bitcoin Core spells arm64 "aarch64-linux-gnu" on Linux but
      # "arm64-apple-darwin" on macOS, so whole platform strings are mapped.
      - fixture:
          file: block.toml
          content: |
            platforms = ["linux/amd64", "darwin/arm64"]

            [tools.quirky]
            version = "29"

            [tools.quirky.source]
            type = "http"
            repo = "example/quirky"
            url = "${env:FAKEGH_URL}/blobs/quirky-{version}/quirky-{version}-{target}.tar.gz"
            strip_components = 1
            bin = ["bin/quirkyd"]

            [tools.quirky.source.target]
            "linux/amd64" = "x86_64-linux-gnu"
            "linux/arm64" = "aarch64-linux-gnu"
            "darwin/amd64" = "x86_64-apple-darwin"
            "darwin/arm64" = "arm64-apple-darwin"
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            contains: "quirky  locked 29.4"
      # Each platform got the artifact its own spelling names.
      - assert:
          file:
            path: block.lock
            contains:
              - "/blobs/quirky-29.4/quirky-29.4-x86_64-linux-gnu.tar.gz"
              - "/blobs/quirky-29.4/quirky-29.4-arm64-apple-darwin.tar.gz"
      - run:
          command: block sync
      - assert:
          exit_code: 0
          stdout:
            equals: |
              quirky  29.4  installed
              shims: quirkyd
      - run:
          command: block exec quirkyd -version
      - assert:
          exit_code: 0
          stdout:
            contains: "quirkyd 29.4 (fake)"

  - name: a platform the target map does not cover is refused at lock time
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.quirky]
            version = "29"

            [tools.quirky.source]
            type = "http"
            repo = "example/quirky"
            url = "${env:FAKEGH_URL}/blobs/quirky-{version}/quirky-{version}-{target}.tar.gz"
            strip_components = 1
            bin = ["bin/quirkyd"]

            [tools.quirky.source.target]
            "${env:BLOCK_OTHER_PLATFORM}" = "some-other-platform"
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            equals: "block: quirky: unsupported platform ${env:BLOCK_PLATFORM} (available: ${env:BLOCK_OTHER_PLATFORM})\n"
          changes:
            created: []
