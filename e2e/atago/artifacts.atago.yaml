# Artifact handling: archive formats, nested executables, and the archives
# block must refuse (path traversal, links, missing executables) plus hosts
# that ship nothing for this platform. Run with: make e2e
version: "1"

suite:
  name: block artifacts

scenarios:
  - name: zip archives are extracted like tarballs
    env: &t1
      BLOCK_HOME: "${workdir}/home"
      BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}/t1"
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.zipper]
            version = "3"
            [tools.zipper.source]
            type = "github_release"
            repo = "example/zipper"
            asset = "zipper_{version}_{os}_{arch}.zip"
            bin = ["zipper"]
      - run:
          shell: true
          command: block lock && block sync
      - assert:
          exit_code: 0
          stdout:
            contains: "zipper  3.0.0  installed"
      - run:
          command: block exec zipper
      - assert:
          exit_code: 0
          stdout:
            contains: "zipper 3.0.0 (fake)"

  - name: executables in a subdirectory of the archive are found
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.nested]
            version = "1"
            [tools.nested.source]
            type = "github_release"
            repo = "example/nested"
            asset = "nested_{version}_{os}_{arch}.tar.gz"
            bin = ["bin/nested"]
      - run:
          shell: true
          command: block lock && block sync
      - run:
          command: block exec nested
      - assert:
          exit_code: 0
          stdout:
            contains: "nested 1.0.0 (fake)"

  - name: a recipe that does not ship this platform is rejected at lock time
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.maconly]
            version = "0.1"
            [tools.maconly.source]
            type = "github_release"
            repo = "example/maconly"
            asset = "maconly_{version}_{os}_{arch}.tar.gz"
            platforms = ["${env:BLOCK_OTHER_PLATFORM}"]
            bin = ["maconly"]
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            equals: "block: BLK2007: maconly: unsupported platform ${env:BLOCK_PLATFORM} (available: ${env:BLOCK_OTHER_PLATFORM})\n"
          changes:
            created: []

  - name: a release missing the expected asset names what it does have
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.foo]
            version = "1.2"
            [tools.foo.source]
            type = "github_release"
            repo = "example/foo"
            asset = "foo-{version}-{os}-{arch}.tar.gz"
            bin = ["foo"]
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            contains:
              - 'block: BLK2004: foo: release v1.2.0 of example/foo has no asset "foo-1.2.0-'
              - "foo_1.2.0_${env:BLOCK_ASSET_PLATFORM}.tar.gz"

  - name: an archive that escapes its directory is refused
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.evil]
            version = "1"
            [tools.evil.source]
            type = "github_release"
            repo = "example/evil"
            asset = "evil_{version}_{os}_{arch}.tar.gz"
            bin = ["evil"]
      - run:
          shell: true
          command: block lock && block sync
      - assert:
          exit_code: 1
          stderr:
            contains: 'block: BLK6002: evil: extract evil_1.0.0_${env:BLOCK_ASSET_PLATFORM}.tar.gz: refusing to extract "../escape": path escapes the destination'
      - assert:
          file:
            path: home/tools/escape
            exists: false
      - assert:
          file:
            path: home/escape
            exists: false
      - assert:
          dir:
            path: home/tools/evil
            exists: true
            count: 0

  - name: an archive containing a symlink is refused
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.linky]
            version = "1"
            [tools.linky.source]
            type = "github_release"
            repo = "example/linky"
            asset = "linky_{version}_{os}_{arch}.tar.gz"
            bin = ["linky"]
      - run:
          shell: true
          command: block lock && block sync
      - assert:
          exit_code: 1
          stderr:
            contains: 'refusing to extract "etc-passwd": it links to the absolute path "/etc/passwd"'

  # A link that stays inside the install is how real distributions ship a
  # second name for one program — Nethermind publishes Nethermind.Runner
  # beside nethermind that way — so it is installed, not refused. What the
  # scenario above refuses is a link that leaves the install directory.
  - name: an archive whose link stays inside the install is unpacked
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.linked]
            version = "1.0"

            [tools.linked.source]
            type = "github_release"
            repo = "example/linked"
            asset = "linked_{version}_{os}_{arch}.tar.gz"
            bin = ["linked"]
      - run:
          shell: true
          command: block lock && block sync
      - assert:
          exit_code: 0
      - run:
          command: block exec linked --version
      - assert:
          exit_code: 0
          stdout:
            contains: "linked 1.0.0 (fake)"
      # The second name is there and resolves to the program: the archive
      # names the link exactly, so it carries no executable suffix of its
      # own, and "test -e" follows it to whatever it points at.
      - run:
          shell: true
          command: 'test -e "$(ls -d home/tools/linked/*/)Runner"'
      - assert:
          exit_code: 0

  # Every one of these is refused on every platform, so the scenarios carry no
  # "only:" gate: an archive that names a Windows drive, or ships a device
  # node, is the same archive wherever it is unpacked, and finding out only on
  # the platform where it would have worked is finding out too late.
  - name: an archive naming a Windows drive is refused everywhere
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.winpath]
            version = "1"
            [tools.winpath.source]
            type = "github_release"
            repo = "example/winpath"
            asset = "winpath_{version}_{os}_{arch}.tar.gz"
            bin = ["winpath"]
      - run:
          shell: true
          command: block lock && block sync
      - assert:
          exit_code: 1
          stderr:
            contains: 'block: BLK6002: winpath: extract winpath_1.0.0_${env:BLOCK_ASSET_PLATFORM}.tar.gz: refusing to extract "C:\\Windows\\System32\\evil": an archive entry may not name a drive, a share or a Windows path'
      - assert:
          dir:
            path: home/tools/winpath
            count: 0

  - name: an archive naming a UNC share is refused everywhere
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.unc]
            version = "1"
            [tools.unc.source]
            type = "github_release"
            repo = "example/unc"
            asset = "unc_{version}_{os}_{arch}.tar.gz"
            bin = ["unc"]
      - run:
          shell: true
          command: block lock && block sync
      - assert:
          exit_code: 1
          stderr:
            contains: 'an archive entry may not name a drive, a share or a Windows path'
      - assert:
          dir:
            path: home/tools/unc
            count: 0

  - name: an archive containing a device node is refused
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.devnode]
            version = "1"
            [tools.devnode.source]
            type = "github_release"
            repo = "example/devnode"
            asset = "devnode_{version}_{os}_{arch}.tar.gz"
            bin = ["devnode"]
      - run:
          shell: true
          command: block lock && block sync
      - assert:
          exit_code: 1
          stderr:
            contains: 'block: BLK6003: devnode: extract devnode_1.0.0_${env:BLOCK_ASSET_PLATFORM}.tar.gz: refusing to extract "null": unsupported entry type'
      - assert:
          dir:
            path: home/tools/devnode
            count: 0

  # Two members of one name: which of them ended up on disk would otherwise
  # depend on extraction order, and on a case-insensitive filesystem two
  # members whose names differ only in case are the same collision.
  - name: an archive that writes one file twice is refused
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.twofiles]
            version = "1"
            [tools.twofiles.source]
            type = "github_release"
            repo = "example/twofiles"
            asset = "twofiles_{version}_{os}_{arch}.tar.gz"
            bin = ["twofiles"]
      - run:
          shell: true
          command: block lock && block sync
      - assert:
          exit_code: 1
          stderr:
            contains: 'block: BLK6006: twofiles: extract twofiles_1.0.0_${env:BLOCK_ASSET_PLATFORM}.tar.gz: refusing to extract "README.md": the archive already wrote that file'
      - assert:
          dir:
            path: home/tools/twofiles
            count: 0

  # A release publishing one name twice is ambiguous, and block resolves the
  # ambiguity by refusing: which of the two a lockfile pinned would otherwise
  # depend on the order the API answered in.
  - name: a release carrying one asset name twice is refused at lock time
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.dupasset]
            version = "1"
            [tools.dupasset.source]
            type = "github_release"
            repo = "example/dupasset"
            asset = "dupasset_{version}_{os}_{arch}.tar.gz"
            bin = ["dupasset"]
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            contains: 'block: BLK2008: dupasset: release v1.0.0 of example/dupasset has 2 assets named "dupasset_1.0.0_${env:BLOCK_ASSET_PLATFORM}.tar.gz"'
      - assert:
          file:
            path: block.lock
            exists: false

  - name: an archive without the declared executable is not installed
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.nobin]
            version = "1"
            [tools.nobin.source]
            type = "github_release"
            repo = "example/nobin"
            asset = "nobin_{version}_{os}_{arch}.tar.gz"
            bin = ["nobin"]
      - run:
          shell: true
          command: block lock && block sync
      - assert:
          exit_code: 1
          stderr:
            contains: 'block: BLK4002: nobin: archive nobin_1.0.0_${env:BLOCK_ASSET_PLATFORM}.tar.gz: executable "nobin" is missing'
      - assert:
          dir:
            path: home/tools/nobin
            count: 0

  - name: an archive that wraps its tools in a versioned directory is unwrapped
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.bundle]
            version = "2"
            [tools.bundle.source]
            type = "github_release"
            repo = "example/bundle"
            asset = "bundle-release-{os}-{arch}.tar.gz"
            strip_components = 1
            bin = ["bin/bundle-cli", "bin/bundle-node"]
      - run:
          shell: true
          command: block lock && block sync
      - assert:
          exit_code: 0
          stdout:
            contains: "bundle  2.0.0  installed"
      # strip_components dropped the wrapping directory: the tools sit under
      # bin/, not bundle-release/bin/.
      - assert:
          dir:
            path: home/tools/bundle
            recursive: true
            glob: "bundle-cli${env:BLOCK_EXE}"
      - assert:
          dir:
            path: home/tools/bundle
            recursive: true
            not_contains: ["bundle-release"]
      - run:
          command: block exec bundle-cli run
      - assert:
          exit_code: 0
          stdout:
            contains: "bundle-cli 2.0.0 (fake)"
      - run:
          command: block exec bundle-node
      - assert:
          exit_code: 0
          stdout:
            contains: "bundle-node 2.0.0 (fake)"

  # Bitcoin Core spells arm64 "aarch64-linux-gnu" on Linux but
  # "arm64-apple-darwin" on macOS, so whole platform strings are mapped. Two
  # scenarios, because the two halves need different manifests: naming
  # platforms is what makes the per-platform URLs visible, and naming none is
  # what makes the install this machine's.
  - name: an upstream whose platform strings are not os and arch uses a target map
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            platforms = ["linux/amd64", "darwin/arm64"]

            [tools.quirky]
            version = "29"

            [tools.quirky.source]
            type = "http"
            repo = "example/quirky"
            url = "${env:FAKEGH_URL}/blobs/quirky-{version}/quirky-{version}-{target}.tar.gz"
            strip_components = 1
            bin = ["bin/quirkyd"]

            [tools.quirky.source.target]
            "linux/amd64" = "x86_64-linux-gnu"
            "linux/arm64" = "aarch64-linux-gnu"
            "darwin/amd64" = "x86_64-apple-darwin"
            "darwin/arm64" = "arm64-apple-darwin"
            "windows/amd64" = "win64"
            "windows/arm64" = "win64-arm"
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            contains: "quirky  locked 29.4"
      # Each platform got the artifact its own spelling names.
      - assert:
          file:
            path: block.lock
            contains:
              - "/blobs/quirky-29.4/quirky-29.4-x86_64-linux-gnu.tar.gz"
              - "/blobs/quirky-29.4/quirky-29.4-arm64-apple-darwin.tar.gz"

  - name: a tool from a target map installs and runs on this machine
    env: *t1
    steps:
      # No platforms list, so the pin is for whichever machine this is — and
      # the target map has to name it.
      - fixture:
          file: block.toml
          content: |
            [tools.quirky]
            version = "29"

            [tools.quirky.source]
            type = "http"
            repo = "example/quirky"
            url = "${env:FAKEGH_URL}/blobs/quirky-{version}/quirky-{version}-{target}.tar.gz"
            strip_components = 1
            bin = ["bin/quirkyd"]

            [tools.quirky.source.target]
            "linux/amd64" = "x86_64-linux-gnu"
            "linux/arm64" = "aarch64-linux-gnu"
            "darwin/amd64" = "x86_64-apple-darwin"
            "darwin/arm64" = "arm64-apple-darwin"
            "windows/amd64" = "win64"
            "windows/arm64" = "win64-arm"
      - run:
          shell: true
          command: block lock && block sync
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "quirky  29.4  installed"
              - "shims: quirkyd"
      - run:
          command: block exec quirkyd -version
      - assert:
          exit_code: 0
          stdout:
            contains: "quirkyd 29.4 (fake)"

  - name: a platform the target map does not cover is refused at lock time
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.quirky]
            version = "29"

            [tools.quirky.source]
            type = "http"
            repo = "example/quirky"
            url = "${env:FAKEGH_URL}/blobs/quirky-{version}/quirky-{version}-{target}.tar.gz"
            strip_components = 1
            bin = ["bin/quirkyd"]

            [tools.quirky.source.target]
            "${env:BLOCK_OTHER_PLATFORM}" = "some-other-platform"
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            equals: "block: BLK2007: quirky: unsupported platform ${env:BLOCK_PLATFORM} (available: ${env:BLOCK_OTHER_PLATFORM})\n"
          changes:
            created: []

  # An artifact the API already says is larger than block transfers is
  # refused when the pin would be made: a lockfile nothing could install is
  # not worth writing, and nothing is downloaded to find that out.
  - name: an asset the upstream reports as too large is refused at lock time
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.huge]
            version = "1"
            [tools.huge.source]
            type = "github_release"
            repo = "example/huge"
            asset = "huge_{version}_{os}_{arch}.tar.gz"
            bin = ["huge"]
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            equals: "block: BLK3004: huge: refusing to download ${env:FAKEGH_URL}/download/example/huge/v1.0.0/huge_1.0.0_${env:BLOCK_ASSET_PLATFORM}.tar.gz: it is larger than the 2147483648 bytes block transfers\n"
          changes:
            created: []

  # A lockfile that names a download which turns out to be larger than block
  # transfers — the upstream replaced the file, or the lock was edited — is
  # refused by sync on the Content-Length, before a byte of the body, and
  # leaves nothing in the cache.
  - name: a download larger than block transfers is refused at sync
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            cometbft = "1.7"
      - run:
          command: block lock
      - assert:
          exit_code: 0
      # Point the pin at the oversized download without touching its digest:
      # the size is what is refused, long before the digest would be.
      - run:
          shell: true
          command: perl -pi -e 's#/download/cometbft/cometbft/v1.7.4/cometbft_1.7.4_#/download/example/huge/v1.0.0/huge_1.0.0_#' block.lock
      - run:
          command: block sync
      - assert:
          exit_code: 1
          stderr:
            equals: "block: BLK3004: cometbft: refusing to download ${env:FAKEGH_URL}/download/example/huge/v1.0.0/huge_1.0.0_${env:BLOCK_ASSET_PLATFORM}.tar.gz: it is larger than the 2147483648 bytes block transfers\n"
      - assert:
          dir:
            path: home/cache/sha256
            exists: true
            count: 0
      - assert:
          dir:
            path: home/tools
            exists: false

  # Every member counts against the number of entries block extracts, not
  # only the files: the fixture is almost entirely directories, with a
  # symlink and a hard link at the end, and an archive that counted its
  # files alone would have been under the limit.
  - name: an archive with too many entries is refused whatever they are
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.crowded]
            version = "1"
            [tools.crowded.source]
            type = "github_release"
            repo = "example/crowded"
            asset = "crowded_{version}_{os}_{arch}.tar.gz"
            bin = ["crowded"]
      - run:
          shell: true
          command: block lock && block sync
      - assert:
          exit_code: 1
          stderr:
            contains: 'block: BLK6004: crowded: extract crowded_1.0.0_${env:BLOCK_ASSET_PLATFORM}.tar.gz: refusing to extract "Alias": the archive holds more than 200000 entries'
      - assert:
          dir:
            path: home/tools/crowded
            exists: true
            count: 0

  - name: a zip with too many entries is refused whatever they are
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.crowdedzip]
            version = "1"
            [tools.crowdedzip.source]
            type = "github_release"
            repo = "example/crowdedzip"
            asset = "crowdedzip_{version}_{os}_{arch}.zip"
            bin = ["crowdedzip"]
      - run:
          shell: true
          command: block lock && block sync
      - assert:
          exit_code: 1
          stderr:
            contains: 'block: BLK6004: crowdedzip: extract crowdedzip_1.0.0_${env:BLOCK_ASSET_PLATFORM}.zip: refusing to extract "Runner": the archive holds more than 200000 entries'
      - assert:
          dir:
            path: home/tools/crowdedzip
            exists: true
            count: 0

  # A zip stores a symlink's target as the member's contents. One longer than
  # block reads used to be cut at the limit and a link made to whatever path
  # the cut left; it is refused whole instead.
  - name: a zip symlink whose target is longer than block reads is refused
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.longlink]
            version = "1"
            [tools.longlink.source]
            type = "github_release"
            repo = "example/longlink"
            asset = "longlink_{version}_{os}_{arch}.zip"
            bin = ["longlink"]
      - run:
          shell: true
          command: block lock && block sync
      - assert:
          exit_code: 1
          stderr:
            contains: 'block: BLK6004: longlink: extract longlink_1.0.0_${env:BLOCK_ASSET_PLATFORM}.zip: refusing to extract "Runner": its link target is longer than 4096 bytes'
      - assert:
          dir:
            path: home/tools/longlink
            exists: true
            count: 0
