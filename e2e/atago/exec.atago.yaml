# `block exec` runs a command with the installed toolchain first on PATH and
# mirrors its exit status. It never downloads, installs or resolves.
# Run with: make e2e
version: "1"

suite:
  name: block exec

scenarios:
  - name: exec runs a locked tool and forwards its arguments
    env: &t1
      BLOCK_HOME: "${workdir}/home"
      BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}/t1"
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.foundry]
            version = "1.7"

            [tools.foundry.source]
            type = "github_release"
            repo = "foundry-rs/foundry"
            asset = "foundry_v{version}_{os}_{arch}.tar.gz"
            bin = ["forge", "cast", "anvil", "chisel"]
      - run:
          shell: true
          command: block lock && block sync
      - run:
          command: block exec forge test -vvv
      - assert:
          exit_code: 0
          stdout:
            equals: |
              forge 1.7.4 (fake)
              args: test -vvv
          stderr:
            equals: ""
          changes:
            created: []
            modified: []
            deleted: []

  - name: every executable of every locked tool is on PATH
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.foundry]
            version = "1.7"

            [tools.foundry.source]
            type = "github_release"
            repo = "foundry-rs/foundry"
            asset = "foundry_v{version}_{os}_{arch}.tar.gz"
            bin = ["forge", "cast", "anvil", "chisel"]

            [tools.hermes]
            version = "1.13"

            [tools.hermes.source]
            type = "github_release"
            repo = "informalsystems/hermes"
            asset = "hermes-v{version}-{arch}-{os}.tar.gz"
            bin = ["hermes"]

            [tools.hermes.source.os]
            linux = "unknown-linux-gnu"
            darwin = "apple-darwin"
            windows = "pc-windows-msvc"

            [tools.hermes.source.arch]
            amd64 = "x86_64"
            arm64 = "aarch64"
      - run:
          shell: true
          command: block lock && block sync
      - run:
          command: block exec cast --version
      - assert:
          stdout:
            contains: "cast 1.7.4 (fake)"
      - run:
          command: block exec anvil
      - assert:
          stdout:
            contains: "anvil 1.7.4 (fake)"
      - run:
          command: block exec hermes version
      - assert:
          stdout:
            contains: "hermes 1.13.0 (fake)"

  - name: the child's exit status is the exit status of block
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.foundry]
            version = "1.7"

            [tools.foundry.source]
            type = "github_release"
            repo = "foundry-rs/foundry"
            asset = "foundry_v{version}_{os}_{arch}.tar.gz"
            bin = ["forge", "cast", "anvil", "chisel"]
      - run:
          shell: true
          command: block lock && block sync
      - run:
          command: block exec forge --exit 3
      - assert:
          exit_code: 3
          stderr:
            equals: ""

  - name: "-- separates block's arguments from the command's"
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.foundry]
            version = "1.7"

            [tools.foundry.source]
            type = "github_release"
            repo = "foundry-rs/foundry"
            asset = "foundry_v{version}_{os}_{arch}.tar.gz"
            bin = ["forge", "cast", "anvil", "chisel"]
      - run:
          shell: true
          command: block lock && block sync
      - run:
          command: block exec -- forge --version
      - assert:
          exit_code: 0
          stdout:
            contains: "args: --version"

  - name: scripts and make-style commands see the toolchain through PATH
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.foundry]
            version = "1.7"

            [tools.foundry.source]
            type = "github_release"
            repo = "foundry-rs/foundry"
            asset = "foundry_v{version}_{os}_{arch}.tar.gz"
            bin = ["forge", "cast", "anvil", "chisel"]

            [tools.hermes]
            version = "1.13"

            [tools.hermes.source]
            type = "github_release"
            repo = "informalsystems/hermes"
            asset = "hermes-v{version}-{arch}-{os}.tar.gz"
            bin = ["hermes"]

            [tools.hermes.source.os]
            linux = "unknown-linux-gnu"
            darwin = "apple-darwin"
            windows = "pc-windows-msvc"

            [tools.hermes.source.arch]
            amd64 = "x86_64"
            arm64 = "aarch64"
      - fixture:
          file: scripts/integration-test.sh
          content: |
            #!/bin/sh
            set -e
            forge test
            hermes start
      - run:
          shell: true
          command: chmod +x scripts/integration-test.sh && block lock && block sync
      # Handed to an interpreter, which is what a task runner does and what
      # works the same on every platform block supports. What is being
      # asserted is that a process block did not start itself — the script's
      # own child — still resolves the locked tools, because they are on the
      # PATH block exported.
      - run:
          command: block exec sh scripts/integration-test.sh
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "forge 1.7.4 (fake)"
              - "hermes 1.13.0 (fake)"

  # The same script run directly rather than through an interpreter. That
  # needs an executable bit and a kernel that honours "#!", so it is the one
  # half of the behaviour that is Unix only; the portable half is above.
  - name: an executable script is run directly and sees the toolchain
    skip:
      os: windows
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.foundry]
            version = "1.7"

            [tools.foundry.source]
            type = "github_release"
            repo = "foundry-rs/foundry"
            asset = "foundry_v{version}_{os}_{arch}.tar.gz"
            bin = ["forge", "cast", "anvil", "chisel"]

            [tools.hermes]
            version = "1.13"

            [tools.hermes.source]
            type = "github_release"
            repo = "informalsystems/hermes"
            asset = "hermes-v{version}-{arch}-{os}.tar.gz"
            bin = ["hermes"]

            [tools.hermes.source.os]
            linux = "unknown-linux-gnu"
            darwin = "apple-darwin"
            windows = "pc-windows-msvc"

            [tools.hermes.source.arch]
            amd64 = "x86_64"
            arm64 = "aarch64"
      - fixture:
          file: scripts/integration-test.sh
          content: |
            #!/bin/sh
            set -e
            command -v forge
            forge test
      - run:
          shell: true
          command: chmod +x scripts/integration-test.sh && block lock && block sync
      - run:
          command: block exec ./scripts/integration-test.sh
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "/home/tools/foundry/1.7.4-"
              - "forge 1.7.4 (fake)"
  - name: exec works from a subdirectory of the project
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.foundry]
            version = "1.7"

            [tools.foundry.source]
            type = "github_release"
            repo = "foundry-rs/foundry"
            asset = "foundry_v{version}_{os}_{arch}.tar.gz"
            bin = ["forge", "cast", "anvil", "chisel"]
      - fixture:
          file: contracts/.keep
          content: ""
      - run:
          shell: true
          command: block lock && block sync
      - run:
          shell: true
          command: cd contracts && block exec forge build
      - assert:
          exit_code: 0
          stdout:
            contains: "args: build"

  - name: exec refuses to run before sync and never downloads
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.foundry]
            version = "1.7"

            [tools.foundry.source]
            type = "github_release"
            repo = "foundry-rs/foundry"
            asset = "foundry_v{version}_{os}_{arch}.tar.gz"
            bin = ["forge", "cast", "anvil", "chisel"]
      - run:
          command: block exec forge --version
      - assert:
          exit_code: 1
          stderr:
            equals: 'block: BLK1003: block.lock not found; run "block lock" and "block sync"

'
      - run:
          command: block lock
      - run:
          command: block exec forge --version
      - assert:
          exit_code: 1
          stderr:
            equals: 'block: BLK4004: foundry 1.7.4 is not installed; run "block sync"

'
          changes:
            created: []
      - assert:
          dir:
            path: home/tools
            exists: false

  - name: exec needs no network
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.foundry]
            version = "1.7"

            [tools.foundry.source]
            type = "github_release"
            repo = "foundry-rs/foundry"
            asset = "foundry_v{version}_{os}_{arch}.tar.gz"
            bin = ["forge", "cast", "anvil", "chisel"]
      - run:
          shell: true
          command: block lock && block sync
      - run:
          command: block exec forge
          env:
            BLOCK_GITHUB_API_URL: "http://127.0.0.1:1"
      - assert:
          exit_code: 0
          stdout:
            contains: "forge 1.7.4 (fake)"

  - name: exec refuses a toolchain block.toml no longer asks for
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.foundry]
            version = "1.7"

            [tools.foundry.source]
            type = "github_release"
            repo = "foundry-rs/foundry"
            asset = "foundry_v{version}_{os}_{arch}.tar.gz"
            bin = ["forge", "cast", "anvil", "chisel"]
      - run:
          shell: true
          command: block lock && block sync
      - run:
          command: block exec forge --version
      - assert:
          exit_code: 0
      # A tool is added to block.toml but nobody locked: the old toolchain
      # must not keep running as if it were the current one.
      - fixture:
          file: block.toml
          content: |
            [tools.foundry]
            version = "1.7"

            [tools.foundry.source]
            type = "github_release"
            repo = "foundry-rs/foundry"
            asset = "foundry_v{version}_{os}_{arch}.tar.gz"
            bin = ["forge", "cast", "anvil", "chisel"]

            [tools.hermes]
            version = "1.13"

            [tools.hermes.source]
            type = "github_release"
            repo = "informalsystems/hermes"
            asset = "hermes-v{version}-{arch}-{os}.tar.gz"
            bin = ["hermes"]

            [tools.hermes.source.os]
            linux = "unknown-linux-gnu"
            darwin = "apple-darwin"
            windows = "pc-windows-msvc"

            [tools.hermes.source.arch]
            amd64 = "x86_64"
            arm64 = "aarch64"
      - run:
          command: block exec forge --version
      - assert:
          exit_code: 1
          stdout:
            equals: ""
          stderr:
            equals: |
              block: BLK1005: block.lock is stale; run "block lock"
                hermes is declared in block.toml but missing from block.lock
          changes:
            created: []
            modified: []
            deleted: []
      # A changed constraint is just as stale.
      - fixture:
          file: block.toml
          content: |
            [tools.foundry]
            version = "1.6"

            [tools.foundry.source]
            type = "github_release"
            repo = "foundry-rs/foundry"
            asset = "foundry_v{version}_{os}_{arch}.tar.gz"
            bin = ["forge", "cast", "anvil", "chisel"]
      - run:
          command: block exec forge --version
      - assert:
          exit_code: 1
          stderr:
            contains: 'foundry: block.toml wants "1.6" but block.lock was resolved from "1.7"'

  - name: exec refuses an install that is not intact
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.foundry]
            version = "1.7"

            [tools.foundry.source]
            type = "github_release"
            repo = "foundry-rs/foundry"
            asset = "foundry_v{version}_{os}_{arch}.tar.gz"
            bin = ["forge", "cast", "anvil", "chisel"]
      - run:
          shell: true
          command: block lock && block sync
      # What a half-restored CI cache looks like.
      - run:
          shell: true
          command: rm home/tools/foundry/*/cast
      - run:
          command: block exec forge --version
      - assert:
          exit_code: 1
          stderr:
            matches: 'block: BLK4003: foundry 1\.7\.4 is damaged: executable "cast" is missing; run "block sync"'
      # sync repairs it instead of trusting the directory.
      - run:
          command: block sync
      - assert:
          exit_code: 0
          stdout:
            equals: "foundry  1.7.4  installed\n"
      - run:
          command: block exec cast --version
      - assert:
          exit_code: 0
          stdout:
            contains: "cast 1.7.4 (fake)"

  - name: exec of a command that exists nowhere fails with exit 1
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.foundry]
            version = "1.7"

            [tools.foundry.source]
            type = "github_release"
            repo = "foundry-rs/foundry"
            asset = "foundry_v{version}_{os}_{arch}.tar.gz"
            bin = ["forge", "cast", "anvil", "chisel"]
      - run:
          shell: true
          command: block lock && block sync
      - run:
          command: block exec no-such-tool --flag
      - assert:
          exit_code: 1
          stderr:
            equals: 'block: BLK5001: command "no-such-tool" not found in the locked toolchain or on PATH

'

  - name: exec without a command prints usage
    env: *t1
    steps:
      - run:
          command: block exec
      - assert:
          exit_code: 1
          stderr:
            contains: "requires at least 1 arg(s), only received 0"
      - run:
          command: block exec --help
      - assert:
          exit_code: 0
          stdout:
            contains: "block exec make test"
