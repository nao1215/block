# The single most important contract of block, end to end:
#
#   lock = resolve, sync = install, exec = run.
#   sync never resolves. exec never installs. lock is the only operation that
#   can move a pin.
#
# The fake GitHub has two points in time: at ${env:FAKEGH_URL}/t1 foundry's
# newest 1.7 release is 1.7.4; at ${env:FAKEGH_URL} 1.7.5 has been published.
# Run with: make e2e
version: "1"

suite:
  name: block contract

scenarios:
  - name: a pin survives a new upstream release until block lock moves it
    env:
      BLOCK_HOME: "${workdir}/home"
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.foundry]
            version = "1.7"

            [tools.foundry.source]
            type = "github_release"
            repo = "foundry-rs/foundry"
            asset = "foundry_v{version}_{os}_{arch}.tar.gz"
            bin = ["forge", "cast", "anvil", "chisel"]
      # lock at t1: 1.7.4 is the newest 1.7.x.
      - run:
          command: block lock
          env:
            BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}/t1"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              foundry  locked 1.7.4
              wrote block.lock
      - run:
          command: block sync
          env:
            BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}/t1"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              foundry  1.7.4  installed
              shims: anvil, cast, chisel, forge

      # Time passes: upstream publishes 1.7.5. Everything below runs against
      # the new upstream.

      # sync keeps the pin and does not touch the lockfile.
      - run:
          command: block sync
          env:
            BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}"
      - assert:
          exit_code: 0
          stdout:
            equals: "foundry  1.7.4  cached\n"
          changes:
            created: []
            modified: []
            deleted: []
      - assert:
          file:
            path: block.lock
            contains: 'version = "1.7.4"'
      - assert:
          file:
            path: block.lock
            not_contains: "1.7.5"

      # exec uses the pinned 1.7.4.
      - run:
          command: block exec forge --version
          env:
            BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}"
      - assert:
          exit_code: 0
          stdout:
            contains: "forge 1.7.4 (fake)"

      # lock --check sees 1.7.5, exits 2, changes nothing.
      - run:
          command: block lock --check
          env:
            BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}"
      - assert:
          exit_code: 2
          stdout:
            equals: "foundry  1.7.4 -> 1.7.5\n"
          stderr:
            equals: ""
          changes:
            created: []
            modified: []
            deleted: []

      # lock moves the pin.
      - run:
          command: block lock
          env:
            BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              foundry  1.7.4 -> 1.7.5
              wrote block.lock
          changes:
            modified: [block.lock]
            deleted: []
      - assert:
          file:
            path: block.lock
            contains: 'version = "1.7.5"'
      - run:
          command: block sync
          env:
            BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}"
      - assert:
          exit_code: 0
          stdout:
            equals: "foundry  1.7.5  installed\n"
      - run:
          command: block exec forge --version
      - assert:
          exit_code: 0
          stdout:
            contains: "forge 1.7.5 (fake)"

  - name: sync and exec work with no upstream at all
    env:
      BLOCK_HOME: "${workdir}/home"
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.foundry]
            version = "1.7"

            [tools.foundry.source]
            type = "github_release"
            repo = "foundry-rs/foundry"
            asset = "foundry_v{version}_{os}_{arch}.tar.gz"
            bin = ["forge", "cast", "anvil", "chisel"]

            [tools.hermes]
            version = "1.13"

            [tools.hermes.source]
            type = "github_release"
            repo = "informalsystems/hermes"
            asset = "hermes-v{version}-{arch}-{os}.tar.gz"
            bin = ["hermes"]

            [tools.hermes.source.os]
            linux = "unknown-linux-gnu"
            darwin = "apple-darwin"
            windows = "pc-windows-msvc"

            [tools.hermes.source.arch]
            amd64 = "x86_64"
            arm64 = "aarch64"
      - run:
          command: block lock
          env:
            BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}/t1"
      # An API base that refuses connections: sync only needs the lock's
      # exact artifact URLs, exec needs nothing.
      - run:
          command: block sync
          env:
            BLOCK_GITHUB_API_URL: "http://127.0.0.1:1"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              foundry  1.7.4   installed
              hermes   1.13.0  installed
              shims: anvil, cast, chisel, forge, hermes
      - run:
          command: block exec hermes version
          env:
            BLOCK_GITHUB_API_URL: "http://127.0.0.1:1"
      - assert:
          exit_code: 0
          stdout:
            contains: "hermes 1.13.0 (fake)"

  # A lockfile is committed, reviewed and diffed. The same manifest resolved
  # against the same upstream has to produce the same bytes — otherwise every
  # re-lock is a diff nobody can read, and two developers "agreeing" is a
  # coincidence of map iteration order.
  - name: the same input produces the same lockfile, byte for byte
    env:
      BLOCK_HOME: "${workdir}/home"
      BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}/t1"
    steps:
      # Two projects, two stores, and the tools written in the opposite order:
      # nothing about the lockfile may depend on any of that.
      - fixture:
          file: a/block.toml
          content: |
            [tools.foundry]
            version = "1.7"

            [tools.foundry.source]
            type = "github_release"
            repo = "foundry-rs/foundry"
            asset = "foundry_v{version}_{os}_{arch}.tar.gz"
            bin = ["forge", "cast", "anvil", "chisel"]

            [tools.foo]
            version = "1.2"

            [tools.foo.source]
            type = "github_release"
            repo = "example/foo"
            asset = "foo_{version}_{os}_{arch}.tar.gz"
            bin = ["foo"]
      - fixture:
          file: b/block.toml
          content: |
            [tools.foo]
            version = "1.2"

            [tools.foo.source]
            type = "github_release"
            repo = "example/foo"
            asset = "foo_{version}_{os}_{arch}.tar.gz"
            bin = ["foo"]

            [tools.foundry]
            version = "1.7"

            [tools.foundry.source]
            type = "github_release"
            repo = "foundry-rs/foundry"
            asset = "foundry_v{version}_{os}_{arch}.tar.gz"
            bin = ["forge", "cast", "anvil", "chisel"]
      - run:
          shell: true
          command: cd a && block lock
      - assert:
          exit_code: 0
      - run:
          shell: true
          command: cd b && block lock
          env:
            BLOCK_HOME: "${workdir}/second-store"
            BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}/t1"
      - assert:
          exit_code: 0
      - run:
          shell: true
          command: diff -u a/block.lock b/block.lock
      - assert:
          exit_code: 0
          stdout:
            equals: ""
      # And locking again over an identical lockfile writes nothing at all —
      # not the same bytes again, but no write: a no-op has to look like one
      # to whatever is watching the file.
      - run:
          shell: true
          command: cd a && block lock
      - assert:
          exit_code: 0
          stdout:
            contains: "block.lock is up to date"
          changes:
            created: []
            modified: []
            deleted: []
