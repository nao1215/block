# `block sync` installs exactly what block.lock says. It never resolves a
# version, never writes block.lock, and fails on any disagreement. The same
# command means the same thing locally and in CI. Run with: make e2e
version: "1"

suite:
  name: block sync

scenarios:
  - name: sync installs the locked artifacts into the store
    env: &t1
      BLOCK_HOME: "${workdir}/home"
      BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}/t1"
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
            hermes = "1.13"
      - run:
          command: block lock
      - run:
          command: block sync
      - assert:
          exit_code: 0
          stdout:
            equals: |
              foundry  1.7.4   installed
              hermes   1.13.0  installed
          changes:
            created:
              - home/tools/**
            modified: []
            deleted: []
      - assert:
          dir:
            path: home/tools/foundry
            count: 1
            glob: "1.7.4-*"

  - name: a second sync is served from the store and touches nothing
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      - run:
          command: block sync
      - run:
          command: block sync
      - assert:
          exit_code: 0
          stdout:
            equals: "foundry  1.7.4  cached\n"
          stderr:
            equals: ""
          changes:
            created: []
            modified: []
            deleted: []

  - name: two projects share one store and the second never downloads
    env: *t1
    steps:
      - fixture:
          file: a/block.toml
          content: |
            [tools]
            foundry = "1.7"
      - fixture:
          file: b/block.toml
          content: |
            [tools]
            foundry = "1.7"
      - run:
          shell: true
          command: cd a && block lock && block sync
      - assert:
          stdout:
            contains: "foundry  1.7.4  installed"
      - run:
          shell: true
          command: cd b && block lock
      - run:
          shell: true
          command: cd b && block sync
      - assert:
          exit_code: 0
          stdout:
            equals: "foundry  1.7.4  cached\n"
          changes:
            created: []
            modified: []

  - name: sync downloads from the exact locked URL when the cache is cold
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      # A fresh store and no reachable API: the lock's URL is all sync needs.
      - run:
          command: block sync
          env:
            BLOCK_HOME: "${workdir}/fresh"
            BLOCK_GITHUB_API_URL: "http://127.0.0.1:1"
      - assert:
          exit_code: 0
          stdout:
            equals: "foundry  1.7.4  installed\n"
      - assert:
          dir:
            path: fresh/cache/sha256
            count: 1

  - name: sync fails when block.lock is missing
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - run:
          command: block sync
      - assert:
          exit_code: 1
          stderr:
            equals: 'block: block.lock not found; run "block lock"

'
          changes:
            created: []

  - name: sync fails when block.toml changed after block.lock and does not lock
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.6"
            hermes = "1.13"
      - run:
          command: block sync
      - assert:
          exit_code: 1
          stderr:
            equals: |
              block: block.lock is stale; run "block lock"
                foundry: block.toml wants "1.6" but block.lock was resolved from "1.7"
                hermes is declared in block.toml but missing from block.lock
          changes:
            modified: []
            created: []
      - assert:
          dir:
            path: home/tools
            exists: false

  - name: sync fails when a tool was removed from block.toml but not block.lock
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
            hermes = "1.13"
      - run:
          command: block lock
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - run:
          command: block sync
      - assert:
          exit_code: 1
          stderr:
            contains: "hermes is in block.lock but not declared in block.toml"

  - name: sync fails when a project-local source changed
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.foo]
            version = "1.2"
            [tools.foo.source]
            type = "github_release"
            repo = "example/foo"
            asset = "foo_{version}_{os}_{arch}.tar.gz"
            bin = ["foo"]
      - run:
          command: block lock
      - fixture:
          file: block.toml
          content: |
            [tools.foo]
            version = "1.2"
            [tools.foo.source]
            type = "github_release"
            repo = "example/foo-fork"
            asset = "foo_{version}_{os}_{arch}.tar.gz"
            bin = ["foo"]
      - run:
          command: block sync
      - assert:
          exit_code: 1
          stderr:
            contains: "foo: the source definition changed since block.lock was resolved"

  - name: sync fails when block.lock has no artifact for this platform
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            platforms = ["darwin/arm64"]
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      - run:
          command: block sync
      - assert:
          exit_code: 1
          stderr:
            contains: "foundry: block.lock has no artifact for linux/amd64"
          changes:
            modified: []

  - name: a checksum mismatch aborts the install and installs nothing
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      # Simulate a tampered artifact (or a hand-edited lock): flip the digest.
      - run:
          shell: true
          command: sed -i -E 's/^sha256 = "[0-9a-f]{4}/sha256 = "0000/' block.lock
      - run:
          command: block sync
          env:
            BLOCK_HOME: "${workdir}/fresh"
      - assert:
          exit_code: 1
          stderr:
            matches: 'block: foundry: checksum mismatch for http://[^ ]+/foundry_v1\.7\.4_linux_amd64\.tar\.gz: want sha256 0000[0-9a-f]{60}, got [0-9a-f]{64}'
      - assert:
          dir:
            path: fresh/tools
            exists: false

  - name: a cached archive is trusted only under its own digest
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      - run:
          shell: true
          command: sed -i -E 's/^sha256 = "[0-9a-f]{4}/sha256 = "0000/' block.lock
      - run:
          command: block sync
      - assert:
          exit_code: 1
          stderr:
            contains: "checksum mismatch"

  - name: a lockfile pointing at a plain-http host is refused
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      - run:
          shell: true
          command: sed -i -E 's#^url = "http://[^/]+/#url = "http://mirror.example.com/#' block.lock
      - run:
          command: block sync
          env:
            BLOCK_HOME: "${workdir}/fresh"
      - assert:
          exit_code: 1
          stderr:
            contains: "block: foundry: refusing insecure url http://mirror.example.com/download/foundry-rs/foundry/v1.7.4/foundry_v1.7.4_linux_amd64.tar.gz: only https is allowed"

  - name: a hand-edited lockfile with an invalid digest is rejected before any network access
    env:
      BLOCK_HOME: "${workdir}/home"
      BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}/ratelimited"
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - fixture:
          file: block.lock
          content: |
            version = 1

            [[tools]]
            name = "foundry"
            constraint = "1.7"
            version = "1.7.4"
            bin = ["forge"]
            source = "sha256:x"

            [[tools.artifacts]]
            platform = "linux/amd64"
            url = "https://example.com/x.tar.gz"
            sha256 = "nothex"
      - run:
          command: block sync
      - assert:
          exit_code: 1
          stderr:
            equals: 'block: block.lock: tool "foundry" (linux/amd64): sha256 "nothex" is not a 64-character hex digest

'

  - name: a lockfile from a newer block is refused
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - fixture:
          file: block.lock
          content: |
            version = 2
      - run:
          command: block sync
      - assert:
          exit_code: 1
          stderr:
            equals: "block: block.lock: unsupported lockfile version 2 (this block writes version 1)\n"
