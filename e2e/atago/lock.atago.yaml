# `block lock` resolves block.toml into block.lock and is the only command that
# moves a pin. ${env:FAKEGH_URL}/t1 is the older upstream (foundry 1.7.4,
# hermes 1.13.0, example/foo 1.2.0); ${env:FAKEGH_URL} has foundry 1.7.5,
# hermes 1.13.1 and foo 1.2.3. Run with: make e2e
version: "1"

suite:
  name: block lock

scenarios:
  - name: lock pins the newest release matching a minor constraint
    env: &t1
      BLOCK_HOME: "${workdir}/home"
      BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}/t1"
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      # GitHub records a sha256 for the asset, so lock writes it down without
      # downloading anything.
      - assert:
          exit_code: 0
          stdout:
            equals: |
              foundry  locked 1.7.4
              wrote block.lock
          stderr:
            equals: ""
          changes:
            created: [block.lock]
            modified: []
      - assert:
          file:
            path: block.lock
            contains:
              - "# This file is generated by block. Do not edit it by hand."
              - "version = 1"
              - 'name = "foundry"'
              - 'constraint = "1.7"'
              - 'version = "1.7.4"'
              - 'bin = ["forge", "cast", "anvil", "chisel"]'
              - 'platform = "${env:BLOCK_PLATFORM}"'
              - "/download/foundry-rs/foundry/v1.7.4/foundry_v1.7.4_${env:BLOCK_ASSET_PLATFORM}.tar.gz"
      # The lock records facts, not the recipe; a registry tool carries no
      # source fingerprint, so a registry change never stales it.
      - assert:
          file:
            path: block.lock
            not_contains:
              - "repo ="
              - "asset ="
              - "source ="
      - run:
          shell: true
          command: grep -E 'sha256 = "[0-9a-f]{64}"' block.lock
      - assert:
          exit_code: 0

  - name: an exact constraint pins exactly that release
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7.0"
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            contains: "foundry  locked 1.7.0"

  - name: a major-only constraint takes the newest stable release and skips pre-releases
    env: *t1
    steps:
      # At t1 the tags are v1.6.0, v1.7.0, v1.7.1, v1.7.4, v1.8.0-rc1 and a nightly.
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1"
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            contains: "foundry  locked 1.7.4"

  - name: running lock again with nothing new is a no-op
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            equals: |
              foundry  1.7.4
              block.lock is up to date
          stderr:
            equals: ""
          changes:
            created: []
            modified: []
            deleted: []

  - name: lock moves every pin to the newest release its constraint allows
    env:
      BLOCK_HOME: "${workdir}/home"
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
            hermes = "1.13"
      - run:
          command: block lock
          env:
            BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}/t1"
      - run:
          command: block lock
          env:
            BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              foundry  1.7.4 -> 1.7.5
              hermes   1.13.0 -> 1.13.1
              wrote block.lock
      - assert:
          file:
            path: block.lock
            contains:
              - 'version = "1.7.5"'
              - 'version = "1.13.1"'

  - name: a kept pin gains an artifact for a newly declared platform
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
            hermes = "1.13"
      - run:
          command: block lock
      - fixture:
          file: block.toml
          content: |
            platforms = ["linux/amd64", "darwin/arm64"]
            [tools]
            foundry = "1.7"
            hermes = "1.13"
      # Only hermes is re-resolved, but foundry still needs its darwin
      # artifact: block resolves that exact version, it does not move the pin.
      - run:
          command: block lock hermes
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "foundry  1.7.4"
              - "wrote block.lock"
      - assert:
          file:
            path: block.lock
            contains:
              - "foundry_v1.7.4_darwin_arm64.tar.gz"
              - "hermes-v1.13.0-aarch64-apple-darwin.tar.gz"

  - name: lock with a tool name re-resolves only that tool
    env:
      BLOCK_HOME: "${workdir}/home"
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
            hermes = "1.13"
      - run:
          command: block lock
          env:
            BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}/t1"
      - run:
          command: block lock hermes
          env:
            BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              foundry  1.7.4
              hermes   1.13.0 -> 1.13.1
              wrote block.lock
      - assert:
          file:
            path: block.lock
            contains:
              - 'version = "1.7.4"'
              - 'version = "1.13.1"'
      - run:
          command: block lock geth
          env:
            BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}"
      - assert:
          exit_code: 1
          stderr:
            equals: 'block: BLK1008: tool "geth" is not declared in block.toml

'

  - name: lock never crosses the constraint
    env:
      BLOCK_HOME: "${workdir}/home"
      BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}"
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7.4"
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            contains: "foundry  locked 1.7.4"
      - run:
          command: block lock --check
      - assert:
          exit_code: 0
          stdout:
            equals: "foundry  1.7.4 (up-to-date)\n"

  - name: a changed constraint re-resolves that tool
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.6"
            hermes = "1.13"
      - run:
          command: block lock
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
            hermes = "1.13"
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            equals: |
              foundry  1.6.0 -> 1.7.4
              hermes   1.13.0
              wrote block.lock

  - name: adding a platform fetches only the missing artifacts
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      - fixture:
          file: block.toml
          content: |
            platforms = ["linux/amd64", "darwin/arm64"]
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            contains: "wrote block.lock"
      - assert:
          file:
            path: block.lock
            contains:
              - 'platform = "darwin/arm64"'
              - 'platform = "linux/amd64"'
              - "foundry_v1.7.4_darwin_arm64.tar.gz"

  - name: removing a tool from block.toml drops it from block.lock
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
            hermes = "1.13"
      - run:
          command: block lock
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            contains: "wrote block.lock"
      - assert:
          file:
            path: block.lock
            not_contains: "hermes"

  - name: recipes that rename os and arch resolve the right asset
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            hermes = "1.13"
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            contains: "hermes  locked 1.13.0"
      - assert:
          file:
            path: block.lock
            contains: "/download/informalsystems/hermes/v1.13.0/hermes-v1.13.0-${env:BLOCK_RUST_TRIPLE}.tar.gz"

  - name: a project-local source works without a registry entry
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"

            [tools.foo]
            version = "1.2"

            [tools.foo.source]
            type = "github_release"
            repo = "example/foo"
            asset = "foo_{version}_{os}_{arch}.tar.gz"
            bin = ["foo"]
      - run:
          command: block lock
      # example/foo publishes no digest: the artifact is downloaded once so
      # its checksum can be recorded (trust on first use).
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "foo      locked 1.2.0"
              - "foundry  locked 1.7.4"
          stderr:
            equals: "downloading ${env:FAKEGH_URL}/download/example/foo/v1.2.0/foo_1.2.0_${env:BLOCK_ASSET_PLATFORM}.tar.gz\n"
          changes:
            created:
              - block.lock
              - home/cache/sha256/*
      # A project-local recipe is fingerprinted so that editing it stales the lock.
      - assert:
          file:
            path: block.lock
            contains:
              - "/download/example/foo/v1.2.0/foo_1.2.0_${env:BLOCK_ASSET_PLATFORM}.tar.gz"
              - 'source = "sha256:'
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stderr:
            equals: ""
          stdout:
            contains: "block.lock is up to date"

  - name: an http source downloads from the vendor's server using the tagged commit
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.geth]
            version = "1.17"

            [tools.geth.source]
            type = "http"
            repo = "ethereum/go-ethereum"
            url = "${env:FAKEGH_URL}/blobs/geth-{os}-{arch}-{version}-{commit}.tar.gz"
            strip_components = 1
            bin = ["geth"]
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            contains: "geth  locked 1.17.4"
      - run:
          shell: true
          command: grep -E 'url = ".*/blobs/geth-${env:BLOCK_DASH_PLATFORM}-1\.17\.4-[0-9a-f]{8}\.tar\.gz"' block.lock && grep -q 'strip_components = 1' block.lock
      - assert:
          exit_code: 0
      - run:
          command: block sync
      - assert:
          exit_code: 0
          stdout:
            equals: |
              geth  1.17.4  installed
              shims: geth
      - run:
          command: block exec geth version
      - assert:
          exit_code: 0
          stdout:
            contains: "geth 1.17.4 (fake)"
      - run:
          command: block lock --check
          env:
            BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}"
      - assert:
          exit_code: 2
          stdout:
            equals: "geth  1.17.4 -> 1.17.5\n"

  - name: a release that ships a single raw executable is installed under its bin name
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.rawbin]
            version = "1"

            [tools.rawbin.source]
            type = "github_release"
            repo = "example/rawbin"
            asset = "rawbin-{os}-{arch}"
            bin = ["rawbin"]
      - run:
          shell: true
          command: block lock && block sync
      - assert:
          exit_code: 0
          stdout:
            contains: "rawbin  1.0.0  installed"
      # The executable is installed under its bin name, next to the marker
      # that says the install completed.
      - assert:
          dir:
            path: home/tools/rawbin
            recursive: true
            glob: "rawbin"
      - run:
          command: block exec rawbin --flag
      - assert:
          exit_code: 0
          stdout:
            equals: |
              rawbin 1.0.0 (fake)
              args: --flag

  - name: a project-local source can opt out of the v tag prefix
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.bare]
            version = "2"

            [tools.bare.source]
            type = "github_release"
            repo = "example/bare"
            tag_prefix = ""
            asset = "bare_{version}_{os}_{arch}.tar.gz"
            bin = ["bare"]
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            contains: "bare  locked 2.5.0"

  - name: lock works from a subdirectory of the project
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - fixture:
          file: contracts/.keep
          content: ""
      - run:
          shell: true
          command: cd contracts && block lock
      - assert:
          exit_code: 0
          stdout:
            contains: "wrote block.lock"
          changes:
            created: [block.lock]

  - name: lock fails when no release satisfies the constraint
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "3"
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            equals: 'block: BLK2001: foundry: no version of foundry-rs/foundry matches "3"

'
          changes:
            created: []

  - name: a tag whose only release is a pre-release is not selected
    env:
      BLOCK_HOME: "${workdir}/home"
      BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}"
    steps:
      # v1.9.0 is tagged and released, but the release is flagged prerelease.
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.9"
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            contains: 'block: BLK2002: foundry: no published release of foundry-rs/foundry matches "1.9"'

  - name: a tag without a release falls back to the next older release
    env:
      BLOCK_HOME: "${workdir}/home"
      BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}"
    steps:
      # v1.7.6 exists as a tag only; v1.7.5 is the newest published release.
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            contains: "foundry  locked 1.7.5"

  - name: an unknown tool names the registry and the project-local escape hatch
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            solana = "2"
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            equals: 'block: BLK1007: unknown tool "solana": it is not in the registry (run "block list" to see the supported tools); define [tools.solana.source] in block.toml to use it anyway

'

  - name: manifest errors are reported with the offending key
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
            [tool]
            typo = "1"
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            equals: 'block: BLK1002: block.toml: unknown key "tool"

'
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "^1.7"
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            contains: 'block: BLK1002: block.toml: tool "foundry": invalid version constraint "^1.7"'
      - fixture:
          file: block.toml
          content: |
            [tools]
            Foundry = "1.7"
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            contains: 'block: BLK1002: block.toml: invalid tool name "Foundry"'
      - fixture:
          file: block.toml
          content: |
            platforms = ["plan9/amd64"]
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            contains: 'block: BLK1002: block.toml: unsupported platform "plan9/amd64": supported platforms are linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64'
      - fixture:
          file: block.toml
          content: |
            [tools.foo]
            version = "1.2"
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            contains: 'tool "foo": a [tools.foo] table needs a [tools.foo.source] table (or write foo = "1.2")'
      - fixture:
          file: block.toml
          content: |
            [tools.foo]
            version = "1.2"
            [tools.foo.source]
            type = "cargo"
            repo = "example/foo"
            asset = "foo_{version}.tar.gz"
            bin = ["foo"]
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            contains: 'tool "foo": unsupported source type "cargo": want "github_release" or "http"'
      - fixture:
          file: block.toml
          content: |
            [tools.foo]
            version = "1.2"
            [tools.foo.source]
            type = "http"
            repo = "example/foo"
            url = "http://mirror.example.com/foo_{version}.tar.gz"
            bin = ["foo"]
      - run:
          command: block lock
      # A non-loopback http url passes validation but is refused at download time.
      - assert:
          exit_code: 1
          stderr:
            contains: 'block: BLK6001: foo: refusing insecure url http://mirror.example.com/foo_1.2.0.tar.gz: only https is allowed'

  - name: a missing repository is reported as not found
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.ghost]
            version = "1"
            [tools.ghost.source]
            type = "github_release"
            repo = "example/ghost"
            asset = "ghost_{version}_{os}_{arch}.tar.gz"
            bin = ["ghost"]
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            equals: "block: BLK2003: ghost: repository example/ghost: not found\n"

  - name: a GitHub rate limit is explained with the token hint
    env:
      BLOCK_HOME: "${workdir}/home"
      BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}/ratelimited"
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            contains: "block: BLK2005: foundry: github api: rate limit exceeded (set GITHUB_TOKEN to raise the limit); resets at 2023-11-14T22:13:20Z"

  # One command name must not mean two executables. A shim resolves a command
  # through the lockfile while PATH resolves it by directory order, so an
  # ambiguous toolchain can run different programs depending on how it was
  # called. block refuses it at lock, before anything is written.
  - name: two tools claiming one command name are refused
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.foo]
            version = "1.2"

            [tools.foo.source]
            type = "github_release"
            repo = "example/foo"
            asset = "foo_{version}_{os}_{arch}.tar.gz"
            bin = ["foo"]

            [tools.clash]
            version = "1.2"

            [tools.clash.source]
            type = "github_release"
            repo = "example/foo"
            asset = "foo_{version}_{os}_{arch}.tar.gz"
            bin = ["foo"]
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            equals: 'block: BLK1009: tools "clash" and "foo" both provide the command "foo"; remove one from block.toml

'
          changes:
            created: []
            modified: []
            deleted: []

  # The same rule inside one tool: two paths in the archive whose base name is
  # the same command.
  - name: one tool listing the same command twice is refused
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.foo]
            version = "1.2"

            [tools.foo.source]
            type = "github_release"
            repo = "example/foo"
            asset = "foo_{version}_{os}_{arch}.tar.gz"
            bin = ["bin/foo", "sbin/foo"]
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            contains: 'bin "bin/foo" and "sbin/foo" would both provide the command "foo"'
          changes:
            created: []
            modified: []
            deleted: []

  # And case: Windows resolves a command on PATH without regard to it, so a
  # lockfile that installs on Linux and collides on Windows is refused
  # everywhere rather than shipped.
  - name: command names differing only in case are refused on every platform
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.foo]
            version = "1.2"

            [tools.foo.source]
            type = "github_release"
            repo = "example/foo"
            asset = "foo_{version}_{os}_{arch}.tar.gz"
            bin = ["foo", "FOO"]
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            contains: 'bin "foo" and "FOO" would both provide the command "FOO"'
          changes:
            created: []
            modified: []
            deleted: []
