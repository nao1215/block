# `block lock` resolves block.toml into block.lock. The fake GitHub exposes
# two points in time: ${env:FAKEGH_URL}/t1 (foundry <= 1.7.1, hermes 1.13.0,
# example/foo 1.2.0) and ${env:FAKEGH_URL} (foundry 1.7.4, hermes 1.13.1,
# foo 1.2.3). Run with: make e2e
version: "1"

suite:
  name: block lock

scenarios:
  - name: lock pins the newest release matching a minor constraint
    env: &t1
      BLOCK_HOME: "${workdir}/home"
      BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}/t1"
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "foundry  locked 1.7.1  +linux/amd64"
              - "wrote block.lock"
          stderr:
            contains: "downloading "
          changes:
            created:
              - block.lock
              - home/cache/sha256/*
            modified: []
      - assert:
          file:
            path: block.lock
            contains:
              - "# This file is generated by block. Do not edit it by hand."
              - "version = 1"
              - 'name = "foundry"'
              - 'constraint = "1.7"'
              - 'version = "1.7.1"'
              - 'repo = "foundry-rs/foundry"'
              - 'bin = ["forge", "cast", "anvil", "chisel"]'
              - 'platform = "linux/amd64"'
              - "/download/foundry-rs/foundry/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz"
      - run:
          shell: true
          command: grep -E 'sha256 = "[0-9a-f]{64}"' block.lock
      - assert:
          exit_code: 0

  - name: an exact constraint pins exactly that release
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7.0"
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            contains: "foundry  locked 1.7.0"

  - name: a major-only constraint takes the newest stable release and skips pre-releases
    env: *t1
    steps:
      # At t1 the tags are v1.6.0, v1.7.0, v1.7.1, v1.8.0-rc1 and a nightly.
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1"
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            contains: "foundry  locked 1.7.1"

  - name: running lock again is a no-op and does not touch block.lock
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "foundry  1.7.1 (unchanged)"
              - "block.lock is up to date"
          stderr:
            equals: ""
          changes:
            created: []
            modified: []
            deleted: []

  - name: lock keeps a satisfied pin even when upstream published a newer release
    env:
      BLOCK_HOME: "${workdir}/home"
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
          env:
            BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}/t1"
      # Time passes: 1.7.4 is out. lock is not update.
      - run:
          command: block lock
          env:
            BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}"
      - assert:
          exit_code: 0
          stdout:
            contains: "foundry  1.7.1 (unchanged)"
          changes:
            modified: []
      - assert:
          file:
            path: block.lock
            contains: 'version = "1.7.1"'
      - assert:
          file:
            path: block.lock
            not_contains: "1.7.4"

  - name: a changed constraint re-resolves only that tool
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.6"
            hermes = "1.13"
      - run:
          command: block lock
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
            hermes = "1.13"
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "foundry  1.6.0 -> 1.7.1"
              - "hermes   1.13.0 (unchanged)"

  - name: adding a platform fetches only the missing artifacts
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      - fixture:
          file: block.toml
          content: |
            platforms = ["linux/amd64", "darwin/arm64"]
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            contains: "foundry  1.7.1 (unchanged)  +darwin/arm64"
          stderr:
            contains: "foundry_v1.7.1_darwin_arm64.tar.gz"
            not_contains: "foundry_v1.7.1_linux_amd64.tar.gz"
      - assert:
          file:
            path: block.lock
            contains:
              - 'platform = "darwin/arm64"'
              - 'platform = "linux/amd64"'

  - name: removing a tool from block.toml drops it from block.lock
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
            hermes = "1.13"
      - run:
          command: block lock
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            contains: "wrote block.lock"
      - assert:
          file:
            path: block.lock
            not_contains: "hermes"

  - name: recipes that rename os and arch resolve the right asset
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            hermes = "1.13"
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            contains: "hermes  locked 1.13.0"
      - assert:
          file:
            path: block.lock
            contains: "/download/informalsystems/hermes/v1.13.0/hermes-v1.13.0-x86_64-unknown-linux-gnu.tar.gz"

  - name: a project-local source works without a registry entry
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"

            [tools.foo]
            version = "1.2"

            [tools.foo.source]
            type = "github_release"
            repo = "example/foo"
            asset = "foo_{version}_{os}_{arch}.tar.gz"
            bin = ["foo"]
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "foo      locked 1.2.0"
              - "foundry  locked 1.7.1"
      - assert:
          file:
            path: block.lock
            contains:
              - 'repo = "example/foo"'
              - "/download/example/foo/v1.2.0/foo_1.2.0_linux_amd64.tar.gz"

  - name: a project-local source can opt out of the v tag prefix
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.bare]
            version = "2"

            [tools.bare.source]
            type = "github_release"
            repo = "example/bare"
            tag_prefix = ""
            asset = "bare_{version}_{os}_{arch}.tar.gz"
            bin = ["bare"]
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            contains: "bare  locked 2.5.0"

  - name: lock works from a subdirectory of the project
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - fixture:
          file: contracts/.keep
          content: ""
      - run:
          shell: true
          command: cd contracts && block lock
      - assert:
          exit_code: 0
          stdout:
            contains: "wrote block.lock"
          changes:
            created:
              - block.lock
              - home/cache/sha256/*

  - name: lock fails when no release satisfies the constraint
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "3"
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            equals: 'block: foundry: no version of foundry-rs/foundry matches "3"

'
          changes:
            created: []

  - name: a tag whose only release is a pre-release is not selected
    env:
      BLOCK_HOME: "${workdir}/home"
      BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}"
    steps:
      # v1.9.0 is tagged and released, but the release is flagged prerelease.
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.9"
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            contains: 'block: foundry: no published release of foundry-rs/foundry matches "1.9"'

  - name: a tag without a release falls back to the next older release
    env:
      BLOCK_HOME: "${workdir}/home"
      BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}"
    steps:
      # v1.7.5 exists as a tag only; v1.7.4 is the newest published release.
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            contains: "foundry  locked 1.7.4"

  - name: an unknown tool names the registry and the project-local escape hatch
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            solana = "2"
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            equals: 'block: unknown tool "solana": it is not in the registry (known tools: foundry, hermes); define [tools.solana.source] in block.toml to use it anyway

'

  - name: manifest errors are reported with the offending key
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
            [tool]
            typo = "1"
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            equals: 'block: block.toml: unknown key "tool"

'
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "^1.7"
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            contains: 'block: block.toml: tool "foundry": invalid version constraint "^1.7"'
      - fixture:
          file: block.toml
          content: |
            [tools]
            Foundry = "1.7"
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            contains: 'block: block.toml: invalid tool name "Foundry"'
      - fixture:
          file: block.toml
          content: |
            platforms = ["windows/amd64"]
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            contains: 'block: block.toml: unsupported platform "windows/amd64": supported platforms are linux/amd64, linux/arm64, darwin/amd64, darwin/arm64'
      - fixture:
          file: block.toml
          content: |
            [tools.foo]
            version = "1.2"
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            contains: 'tool "foo": a [tools.foo] table needs a [tools.foo.source] table (or write foo = "1.2")'
      - fixture:
          file: block.toml
          content: |
            [tools.foo]
            version = "1.2"
            [tools.foo.source]
            type = "http"
            repo = "example/foo"
            asset = "foo_{version}.tar.gz"
            bin = ["foo"]
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            contains: 'tool "foo": unsupported source type "http": only "github_release" is supported'

  - name: a missing repository is reported as not found
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.ghost]
            version = "1"
            [tools.ghost.source]
            type = "github_release"
            repo = "example/ghost"
            asset = "ghost_{version}_{os}_{arch}.tar.gz"
            bin = ["ghost"]
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            equals: "block: ghost: repository example/ghost: not found\n"

  - name: a GitHub rate limit is explained with the token hint
    env:
      BLOCK_HOME: "${workdir}/home"
      BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}/ratelimited"
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools]
            foundry = "1.7"
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            contains: "block: foundry: github api: rate limit exceeded (set GITHUB_TOKEN to raise the limit); resets at 2023-11-14T22:13:20Z"
