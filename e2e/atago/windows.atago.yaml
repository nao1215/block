# The Windows-only paths through block: a .zip artifact, the .exe suffix on
# every installed executable and every shim, shims placed as hard links or
# copies rather than symlinks, PATH lookup by PATHEXT and without regard to
# case, and a child's exit status surviving the extra process Windows puts in
# the way.
#
# This file is not the Windows suite: the whole of e2e/atago runs on Windows,
# and what is here is only what has no meaning anywhere else. A behaviour that
# is the same on three platforms belongs in the file that covers it, asserted
# once — an exit status, a stale lockfile, a zip being unpacked. What is left
# is the handful of things Windows alone does: the .exe suffix on an installed
# executable and on a shim, a shim that is a hard link or a copy because a
# symlink needs privileges, PATH resolved by PATHEXT and without regard to
# case, and a run cancelled where there are no POSIX signals to send.
#
# Every scenario is gated on `only: os: windows`, so the file is inert on the
# other two platforms rather than a second suite someone has to remember.
#
# What is not here: replacing block.exe at the same path and confirming the
# shims are rebuilt from the new one. That needs a second build of block
# mid-scenario, and it is covered exactly — including that the rebuilt shim
# runs the new contents — by TestEnsureRewritesWhenTheBinaryIsReplacedInPlace
# in internal/shim, which runs on this platform too.
#
# Run with: make e2e
version: "1"

suite:
  name: block on windows

scenarios:
  # The whole path, on the platform where every step of it differs: a .zip
  # instead of a .tar.gz, an executable that has to be called .exe to run at
  # all, and a shim that is a copy of block rather than a link to it.
  - name: lock, sync and exec work through a zip artifact
    only:
      os: windows
    env: &t1
      BLOCK_HOME: "${workdir}/home"
      BLOCK_GITHUB_API_URL: "${env:FAKEGH_URL}/t1"
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.zipper]
            version = "3"

            [tools.zipper.source]
            type = "github_release"
            repo = "example/zipper"
            asset = "zipper_{version}_{os}_{arch}.zip"
            bin = ["zipper"]
      - run:
          command: block lock
      - assert:
          exit_code: 0
          stdout:
            equals: |
              zipper  locked 3.0.0
              wrote block.lock
      # The lockfile names the Windows asset, not a tarball someone assumed.
      - assert:
          file:
            path: block.lock
            contains: "zipper_3.0.0_${env:BLOCK_ASSET_PLATFORM}.zip"
      - run:
          command: block sync
      - assert:
          exit_code: 0
          stdout:
            contains: "zipper  3.0.0  installed"
      # Unpacked with the suffix Windows needs to execute it. The install
      # directory carries the artifact digest, so the executable is found by
      # globbing the one directory rather than by naming a digest.
      - assert:
          dir:
            path: home/tools/zipper
            count: 1
            glob: "3.0.0-*"
      - run:
          command: block exec zipper
      - assert:
          exit_code: 0
          stdout:
            equals: |
              zipper 3.0.0 (fake)

  # A shim on Windows is a hard link or a copy of block.exe, not a symlink,
  # because a symlink needs Developer Mode or elevation. What matters is that
  # the file runs and resolves the project it is standing in.
  - name: a shim runs the locked tool without block exec
    only:
      os: windows
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.zipper]
            version = "3"

            [tools.zipper.source]
            type = "github_release"
            repo = "example/zipper"
            asset = "zipper_{version}_{os}_{arch}.zip"
            bin = ["zipper"]
      - run:
          command: block lock
      - run:
          command: block sync
      - assert:
          exit_code: 0
          stdout:
            contains: "shims: zipper"
      - assert:
          file:
            path: home/shims/zipper.exe
            exists: true
      # Run it by its own path: the shim is block under another name, and it
      # finds this project's block.lock from the working directory.
      - run:
          command: "${workdir}/home/shims/zipper.exe"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              zipper 3.0.0 (fake)
  - name: a command name is matched without regard to case
    only:
      os: windows
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.zipper]
            version = "3"

            [tools.zipper.source]
            type = "github_release"
            repo = "example/zipper"
            asset = "zipper_{version}_{os}_{arch}.zip"
            bin = ["zipper"]
      - run:
          command: block lock
      - run:
          command: block sync
      - run:
          command: block exec ZIPPER
      - assert:
          exit_code: 0
          stdout:
            equals: |
              zipper 3.0.0 (fake)

  # Putting the shim directory on PATH must not take a command away from the
  # rest of the system. The project lives in a subdirectory here, so that
  # running from the workdir root really is outside it: block finds block.toml
  # by walking up, and a sibling directory would still be inside the project.
  - name: a shim outside a project steps aside for the system command
    only:
      os: windows
    env: *t1
    steps:
      - fixture:
          file: proj/block.toml
          content: |
            [tools.zipper]
            version = "3"

            [tools.zipper.source]
            type = "github_release"
            repo = "example/zipper"
            asset = "zipper_{version}_{os}_{arch}.zip"
            bin = ["zipper"]
      - run:
          cwd: proj
          command: block lock
      - run:
          cwd: proj
          command: block sync
      # Some other zipper, installed the way anything else on the machine is.
      # Windows decides what is executable by extension, so a .cmd has to be
      # found as readily as an .exe.
      - fixture:
          file: other/zipper.cmd
          content: |
            @echo off
            echo zipper from PATH
      - run:
          env:
            PATH: "${workdir}/other;${env:PATH}"
          command: "${workdir}/home/shims/zipper.exe"
      - assert:
          exit_code: 0
          stdout:
            contains: "zipper from PATH"

  # And when there is nothing to step aside to, it says so rather than
  # guessing.
  - name: a shim outside a project with no other command reports it
    only:
      os: windows
    env: *t1
    steps:
      - fixture:
          file: proj/block.toml
          content: |
            [tools.zipper]
            version = "3"

            [tools.zipper.source]
            type = "github_release"
            repo = "example/zipper"
            asset = "zipper_{version}_{os}_{arch}.zip"
            bin = ["zipper"]
      - run:
          cwd: proj
          command: block lock
      - run:
          cwd: proj
          command: block sync
      - run:
          command: "${workdir}/home/shims/zipper.exe"
      - assert:
          exit_code: 1
          stderr:
            contains: 'zipper: no block project here and no zipper elsewhere on PATH'
  - name: a cancelled run ends the tool and reports it
    only:
      os: windows
    env: *t1
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.zipper]
            version = "3"

            [tools.zipper.source]
            type = "github_release"
            repo = "example/zipper"
            asset = "zipper_{version}_{os}_{arch}.zip"
            bin = ["zipper"]
      - run:
          command: block lock
      - run:
          command: block sync
      # --hang installs no handler and waits; the timeout is what ends it.
      # What matters is that block does not outlive its child and does not
      # report success for a run that never finished.
      - run:
          timeout: 5s
          command: block exec zipper --hang
      - assert:
          exit_code:
            not: 0
