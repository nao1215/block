# Top-level CLI contract: three lifecycle commands, the read-only ones beside
# them, version, error codes, usage errors.
# Run with: make e2e
version: "1"

suite:
  name: block cli

scenarios:
  - name: version prints the build version and the registry snapshot it carries
    steps:
      - run:
          command: block version
      - assert:
          exit_code: 0
          stdout:
            line: 1
            equals: "block v0.0.0-e2e"
      # The recipes are vendored, so the binary says which block-registry
      # revision it was built from: a resolution can be traced back to them.
      - assert:
          stdout:
            line: 2
            matches: '^registry [0-9a-f]{12} \(\d+ recipes from https://github\.com/nao1215/block-registry\)$'

  - name: help explains the three commands and their invariants
    steps:
      - run:
          command: block --help
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "block lock    resolves block.toml into block.lock"
              - "block sync    installs the toolchain pinned in block.lock"
              - "block exec    runs a command with the installed toolchain"
              - "sync never resolves. exec never installs. lock is the only operation that"
              - "block list    shows the tools block supports, all or by ecosystem"
              - "  lock "
              - "  sync "
              - "  exec "
              - "  list "
              - "  version "
      - assert:
          stdout:
            not_contains:
              - "  init "
              - "  update "
              - "  outdated "

  # A CLI that refuses is where a person is standing when they need the
  # documentation, a way to report what went wrong, or a reason to believe the
  # project is maintained. The addresses are in the binary, not only in a
  # README they are not reading.
  - name: help carries the documentation, bug and sponsor links
    steps:
      - run:
          command: block --help
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "Documentation:   https://nao1215.github.io/block/"
              - "Error codes:     https://nao1215.github.io/block/errors/"
              - "Report a bug:    https://github.com/nao1215/block/issues/new"
              - "GitHub Sponsors: https://github.com/sponsors/nao1215"

  # Every refusal carries a code, and the code has to be lookable-up from the
  # terminal the refusal was printed in — offline, with no project around.
  - name: explain describes a code the way the published reference does
    steps:
      - run:
          command: block explain BLK1003
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "BLK1003  block.lock not found"
              - "Fix"
              - "Run \"block lock\" to resolve block.toml into block.lock"
              - "Exits 1. Since v0.1.0."
              - "https://nao1215.github.io/block/errors/#blk1003--blocklock-not-found"
      # However it is spelled: a person retyping a code from a terminal does
      # not reliably retype the prefix.
      - run:
          command: block explain blk1003
      - assert:
          exit_code: 0
          stdout:
            contains: "BLK1003  block.lock not found"
      - run:
          command: block explain 1003
      - assert:
          exit_code: 0
          stdout:
            contains: "BLK1003  block.lock not found"

  - name: explain refuses a code that names nothing
    steps:
      - run:
          command: block explain BLK9999
      - assert:
          exit_code: 1
          stderr:
            equals: |
              block: unknown error code "BLK9999"
              every code is listed at https://nao1215.github.io/block/errors/

  - name: list shows every supported tool, offline and read-only
    env:
      BLOCK_HOME: "${workdir}/home"
      BLOCK_GITHUB_API_URL: "http://127.0.0.1:1"
    steps:
      # No block.toml, no block.lock, no reachable network: list only reads
      # the registry snapshot embedded in the binary.
      - run:
          command: block list
      - assert:
          exit_code: 0
          # Column widths depend on the whole catalog, so a row is matched by
          # its fields rather than by the spacing of the day.
          stdout:
            matches: '(?m)^NAME +ECOSYSTEM +DESCRIPTION$'
          stderr:
            equals: ""
          changes:
            created: []
            modified: []
            deleted: []
      - assert:
          stdout:
            matches: '(?m)^bitcoin-core +bitcoin +Bitcoin reference implementation: full node, wallet and transaction tools$'
      - assert:
          stdout:
            matches: '(?m)^foundry +ethereum +Fast Ethereum application toolkit: build, test, deploy and inspect contracts$'
      # A tool serving two blockchain systems shows both.
      - assert:
          stdout:
            matches: '(?m)^hermes +cosmos, ibc +IBC relayer connecting Cosmos SDK chains, written in Rust$'
      # Rows are sorted by tool name, whatever order the registry files load in.
      - assert:
          stdout:
            matches: "agave[\\s\\S]*bitcoin-core[\\s\\S]*foundry[\\s\\S]*hermes[\\s\\S]*surfpool"

  - name: list takes an ecosystem and shows only its tools
    env: &offline
      BLOCK_HOME: "${workdir}/home"
      BLOCK_GITHUB_API_URL: "http://127.0.0.1:1"
    steps:
      # The ecosystem column is dropped: every row would repeat the argument.
      - run:
          command: block list ethereum
      - assert:
          exit_code: 0
          stdout:
            matches: '(?m)^NAME +COMMANDS +DESCRIPTION$'
      - assert:
          # The ecosystem column is gone; the commands column takes its place.
          stdout:
            not_contains: "ECOSYSTEM"
      - assert:
          stdout:
            matches: '(?m)^foundry +forge, cast, anvil, chisel +Fast Ethereum application toolkit: build, test, deploy and inspect contracts$'
      - assert:
          stdout:
            matches: '(?m)^solc +solc +The Solidity smart-contract compiler$'
      - run:
          command: block list bitcoin
      - assert:
          exit_code: 0
          stdout:
            equals: |
              NAME           COMMANDS                                                          DESCRIPTION
              bitcoin-core   bitcoind, bitcoin-cli, bitcoin-tx, bitcoin-util, bitcoin-wallet   Bitcoin reference implementation: full node, wallet and transaction tools
              btcd           btcd, btcctl                                                      Alternative full-node Bitcoin implementation written in Go
              ord            ord                                                               Ordinal theory index, block explorer and wallet for Bitcoin
      - run:
          command: block list solana
      - assert:
          exit_code: 0
          stdout:
            equals: |
              NAME            COMMANDS                                                          DESCRIPTION
              agave           solana, solana-keygen, solana-test-validator, agave-ledger-tool   Solana validator client and CLI suite, including a local test validator
              anchor          anchor                                                            Framework and CLI for writing, testing and deploying Solana programs
              solana-verify   solana-verify                                                     Verifies that an on-chain Solana program matches its source
              surfpool        surfpool                                                          Local Solana network that streams mainnet state for pre-deployment testing

  - name: a tool serving two blockchain systems is listed under each
    env: *offline
    steps:
      - run:
          command: block list cosmos
      - assert:
          exit_code: 0
          stdout:
            matches: '(?m)^hermes +hermes +IBC relayer connecting Cosmos SDK chains, written in Rust$'
      - run:
          command: block list ibc
      - assert:
          exit_code: 0
          stdout:
            equals: |
              NAME             COMMANDS   DESCRIPTION
              cosmos-relayer   rly        IBC relayer for Cosmos SDK chains written in Go, run as rly
              hermes           hermes     IBC relayer connecting Cosmos SDK chains, written in Rust

  - name: an unknown ecosystem names the ones that exist
    env: *offline
    steps:
      - run:
          command: block list etheruem
      - assert:
          exit_code: 1
          stderr:
            equals: |
              block: BLK1010: unknown ecosystem "etheruem"
              available ecosystems: aptos, avalanche, bitcoin, cardano, celestia, cosmos, ethereum, fabric, ibc, icp, ipfs, near, solana, starknet, stellar, zk, zksync
          stdout:
            equals: ""
      - run:
          command: block list ethereum solana
      - assert:
          exit_code: 1
          stderr:
            contains: "accepts at most 1 arg(s), received 2"

  - name: list does not show project-local tools
    env: *offline
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.foo]
            version = "1.2"
            [tools.foo.source]
            type = "github_release"
            repo = "example/foo"
            asset = "foo_{version}_{os}_{arch}.tar.gz"
            bin = ["foo"]
      - run:
          command: block list
      - assert:
          exit_code: 0
          stdout:
            not_contains: "foo_"
      - run:
          command: block list ethereum
      - assert:
          exit_code: 0
          stdout:
            not_contains: "foo_"
      - run:
          command: block list --installed
      - assert:
          exit_code: 1
          stderr:
            contains: "unknown flag: --installed"

  - name: removed commands do not exist
    steps:
      - run:
          command: block init
      - assert:
          exit_code: 1
          stderr:
            contains: 'block: unknown command "init" for "block"'
      - run:
          command: block update
      - assert:
          exit_code: 1
          stderr:
            contains: 'unknown command "update"'
      - run:
          command: block outdated
      - assert:
          exit_code: 1
          stderr:
            contains: 'unknown command "outdated"'

  - name: commands fail clearly when block.toml is absent
    env:
      BLOCK_HOME: "${workdir}/home"
    steps:
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            equals: "block: BLK1001: block.toml not found in the current directory or any parent\n"
      - run:
          command: block sync
      - assert:
          exit_code: 1
          stderr:
            contains: "block.toml not found"
      - run:
          command: block exec forge --version
      - assert:
          exit_code: 1
          stderr:
            contains: "block.toml not found"
