# Top-level CLI contract: three commands, version, usage errors.
# Run with: make e2e
version: "1"

suite:
  name: block cli

scenarios:
  - name: version prints the injected build version
    steps:
      - run:
          command: block version
      - assert:
          exit_code: 0
          stdout:
            equals: "block v0.0.0-e2e\n"

  - name: help explains the three commands and their invariants
    steps:
      - run:
          command: block --help
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "block lock    resolves block.toml into block.lock"
              - "block sync    installs the toolchain pinned in block.lock"
              - "block exec    runs a command with the installed toolchain"
              - "sync never resolves. exec never installs. lock is the only operation that"
              - "block list    shows the tools block supports, all or by ecosystem"
              - "  lock "
              - "  sync "
              - "  exec "
              - "  list "
              - "  version "
      - assert:
          stdout:
            not_contains:
              - "  init "
              - "  update "
              - "  outdated "

  - name: list shows every supported tool, offline and read-only
    env:
      BLOCK_HOME: "${workdir}/home"
      BLOCK_GITHUB_API_URL: "http://127.0.0.1:1"
    steps:
      # No block.toml, no block.lock, no reachable network: list only reads
      # the registry snapshot embedded in the binary.
      - run:
          command: block list
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "NAME           ECOSYSTEM     DESCRIPTION"
              - "bitcoin-core   bitcoin       Bitcoin reference implementation: full node, wallet and transaction tools"
              - "foundry        ethereum      Fast Ethereum application toolkit: build, test, deploy and inspect contracts"
              - "geth           ethereum      go-ethereum, the Go implementation of an Ethereum execution client"
              # A tool serving two blockchain systems shows both.
              - "hermes         cosmos, ibc   IBC relayer connecting Cosmos SDK chains, written in Rust"
          stderr:
            equals: ""
          changes:
            created: []
            modified: []
            deleted: []
      # Rows are sorted by tool name, whatever order the registry files load in.
      - assert:
          stdout:
            matches: "agave[\\s\\S]*bitcoin-core[\\s\\S]*foundry[\\s\\S]*hermes[\\s\\S]*surfpool"

  - name: list takes an ecosystem and shows only its tools
    env: &offline
      BLOCK_HOME: "${workdir}/home"
      BLOCK_GITHUB_API_URL: "http://127.0.0.1:1"
    steps:
      # The ecosystem column is dropped: every row would repeat the argument.
      - run:
          command: block list ethereum
      - assert:
          exit_code: 0
          stdout:
            equals: |
              NAME         COMMANDS                     DESCRIPTION
              foundry      forge, cast, anvil, chisel   Fast Ethereum application toolkit: build, test, deploy and inspect contracts
              geth         geth                         go-ethereum, the Go implementation of an Ethereum execution client
              lighthouse   lighthouse                   Ethereum consensus (beacon chain) client written in Rust
              reth         reth                         Modular Ethereum execution client written in Rust
              solc         solc                         The Solidity smart-contract compiler
          stderr:
            equals: ""
          changes:
            created: []
            modified: []
            deleted: []
      - run:
          command: block list bitcoin
      - assert:
          exit_code: 0
          stdout:
            equals: |
              NAME           COMMANDS                                                          DESCRIPTION
              bitcoin-core   bitcoind, bitcoin-cli, bitcoin-tx, bitcoin-util, bitcoin-wallet   Bitcoin reference implementation: full node, wallet and transaction tools
      - run:
          command: block list solana
      - assert:
          exit_code: 0
          stdout:
            equals: |
              NAME       COMMANDS                                                          DESCRIPTION
              agave      solana, solana-keygen, solana-test-validator, agave-ledger-tool   Solana validator client and CLI suite, including a local test validator
              anchor     anchor                                                            Framework and CLI for writing, testing and deploying Solana programs
              surfpool   surfpool                                                          Local Solana network that streams mainnet state for pre-deployment testing

  - name: a tool serving two blockchain systems is listed under each
    env: *offline
    steps:
      - run:
          command: block list cosmos
      - assert:
          exit_code: 0
          stdout:
            equals: |
              NAME       COMMANDS   DESCRIPTION
              cometbft   cometbft   Byzantine fault-tolerant consensus engine and node behind Cosmos SDK chains
              gaia       gaiad      Cosmos Hub node (gaiad)
              hermes     hermes     IBC relayer connecting Cosmos SDK chains, written in Rust
              osmosis    osmosisd   Osmosis appchain node (osmosisd), the Cosmos AMM
      - run:
          command: block list ibc
      - assert:
          exit_code: 0
          stdout:
            equals: |
              NAME     COMMANDS   DESCRIPTION
              hermes   hermes     IBC relayer connecting Cosmos SDK chains, written in Rust

  - name: an unknown ecosystem names the ones that exist
    env: *offline
    steps:
      - run:
          command: block list etheruem
      - assert:
          exit_code: 1
          stderr:
            equals: |
              block: unknown ecosystem "etheruem"
              available ecosystems: bitcoin, cosmos, ethereum, ibc, solana
          stdout:
            equals: ""
      - run:
          command: block list ethereum solana
      - assert:
          exit_code: 1
          stderr:
            contains: "accepts at most 1 arg(s), received 2"

  - name: list does not show project-local tools
    env: *offline
    steps:
      - fixture:
          file: block.toml
          content: |
            [tools.foo]
            version = "1.2"
            [tools.foo.source]
            type = "github_release"
            repo = "example/foo"
            asset = "foo_{version}_{os}_{arch}.tar.gz"
            bin = ["foo"]
      - run:
          command: block list
      - assert:
          exit_code: 0
          stdout:
            not_contains: "foo_"
      - run:
          command: block list ethereum
      - assert:
          exit_code: 0
          stdout:
            not_contains: "foo_"
      - run:
          command: block list --installed
      - assert:
          exit_code: 1
          stderr:
            contains: "unknown flag: --installed"

  - name: removed commands do not exist
    steps:
      - run:
          command: block init
      - assert:
          exit_code: 1
          stderr:
            contains: 'block: unknown command "init" for "block"'
      - run:
          command: block update
      - assert:
          exit_code: 1
          stderr:
            contains: 'unknown command "update"'
      - run:
          command: block outdated
      - assert:
          exit_code: 1
          stderr:
            contains: 'unknown command "outdated"'

  - name: commands fail clearly when block.toml is absent
    env:
      BLOCK_HOME: "${workdir}/home"
    steps:
      - run:
          command: block lock
      - assert:
          exit_code: 1
          stderr:
            equals: "block: block.toml not found in the current directory or any parent\n"
      - run:
          command: block sync
      - assert:
          exit_code: 1
          stderr:
            contains: "block.toml not found"
      - run:
          command: block exec forge --version
      - assert:
          exit_code: 1
          stderr:
            contains: "block.toml not found"
